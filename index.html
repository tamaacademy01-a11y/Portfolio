<title>Portfolio Managing Tool</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap">
<style>
/* Layout: dark navy sidebar (navigation + tools) and a light content area; mobile collapses the sidebar into a top bar */
:root{
  --bg:#f2f5f9; --surface:#ffffff; --surface2:#ecf0f6; --line:#dae1eb;
  --fg:#0e1a2c; --muted:#58687e; --accent:#1c4fd6; --accent-fg:#ffffff; --accent-soft:#e2eaff;
  --good:#12803f; --good-soft:#dcf3e5; --warn:#a35f00; --warn-soft:#fdf0d4; --bad:#c22a30; --bad-soft:#fde4e4;
  --review:#7a3ee0; --review-soft:#efe6ff;
  --side-bg:#0e1a2c; --side-fg:#b6c2d6; --side-hi:#ffffff; --side-line:rgba(255,255,255,.1); --side-accent:#6f95ff;
  --shadow:0 1px 2px rgba(14,26,44,.05),0 4px 16px rgba(14,26,44,.05);
  --f-body:"IBM Plex Sans Arabic",system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;
  --f-display:"IBM Plex Sans Arabic",system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;
  --r:12px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0a111b; --surface:#121b29; --surface2:#1a2536; --line:#243247;
  --fg:#e5ebf5; --muted:#8c9db5; --accent:#7a9dff; --accent-fg:#081022; --accent-soft:#1d2b50;
  --good:#52c27a; --good-soft:#12301f; --warn:#eeb04c; --warn-soft:#382a0e; --bad:#ff7a7f; --bad-soft:#3b1a1d;
  --review:#b69cff; --review-soft:#2a2046;
  --side-bg:#070c14; --side-fg:#97a9c4; --side-hi:#ffffff; --side-line:rgba(255,255,255,.08); --side-accent:#7a9dff;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 4px 16px rgba(0,0,0,.28); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0a111b; --surface:#121b29; --surface2:#1a2536; --line:#243247;
  --fg:#e5ebf5; --muted:#8c9db5; --accent:#7a9dff; --accent-fg:#081022; --accent-soft:#1d2b50;
  --good:#52c27a; --good-soft:#12301f; --warn:#eeb04c; --warn-soft:#382a0e; --bad:#ff7a7f; --bad-soft:#3b1a1d;
  --review:#b69cff; --review-soft:#2a2046;
  --side-bg:#070c14; --side-fg:#97a9c4; --side-hi:#ffffff; --side-line:rgba(255,255,255,.08); --side-accent:#7a9dff;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 4px 16px rgba(0,0,0,.28); color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.6;margin:0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--side-bg);z-index:30}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.ic{flex:none}

.shell{display:grid;grid-template-columns:252px minmax(0,1fr);min-height:100vh;min-height:100dvh}
.side{background:var(--side-bg);color:var(--side-fg);display:flex;flex-direction:column;gap:20px;padding:20px 14px;padding-top:calc(20px + env(safe-area-inset-top,0px));position:sticky;top:0;height:100vh;height:100dvh;overflow-y:auto;border-inline-end:1px solid var(--side-line)}
.brand-box{display:flex;gap:11px;align-items:center;padding:4px 8px 16px;border-bottom:1px solid var(--side-line)}
.logo{width:38px;height:38px;border-radius:10px;background:var(--side-accent);color:#0b1426;display:grid;place-items:center;flex:none}
.brand{margin:0;font-size:15px;font-weight:700;color:var(--side-hi);line-height:1.3}
.brand-sub{display:block;font-size:12px;color:var(--side-fg);margin-top:2px}
.side nav{display:flex;flex-direction:column;gap:2px;margin:0}
.side nav button,.side-btn{display:flex;gap:11px;align-items:center;width:100%;border:0;background:transparent;color:var(--side-fg);padding:9px 12px;border-radius:9px;font-weight:500;text-align:start;position:relative}
.side nav button:hover,.side-btn:hover{background:rgba(255,255,255,.07);color:var(--side-hi)}
.side nav button[aria-current="true"]{background:rgba(255,255,255,.12);color:var(--side-hi);font-weight:600}
.side nav button[aria-current="true"]::before{content:"";position:absolute;inset-inline-start:-14px;top:8px;bottom:8px;width:3px;border-radius:3px;background:var(--side-accent)}
.side nav .badge{margin-inline-start:auto}
.side-foot{margin-top:auto;display:flex;flex-direction:column;gap:2px;border-top:1px solid var(--side-line);padding-top:12px}
.badge{background:var(--bad);color:#fff;border-radius:99px;font-size:12px;min-width:20px;padding:0 6px;text-align:center;line-height:20px}
.badge[hidden]{display:none}
.content{min-width:0;display:flex;flex-direction:column}
.pagebar{display:flex;align-items:center;gap:10px;padding-block:11px;background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:15;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.crumb{color:var(--muted);font-size:13px;font-weight:500}
main{width:100%;max-width:1180px;margin:0 auto;padding-block:26px 90px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
@media (min-width:901px){.pagebar{padding-left:max(28px,env(safe-area-inset-left,0px));padding-right:max(28px,env(safe-area-inset-right,0px))}
  main{padding-left:max(28px,env(safe-area-inset-left,0px));padding-right:max(28px,env(safe-area-inset-right,0px))}}
@media (max-width:900px){
  .shell{display:block}
  .side{position:sticky;top:env(safe-area-inset-top,0px);height:auto;z-index:20;flex-direction:row;flex-wrap:wrap;align-items:center;gap:8px 12px;padding-block:10px;
    padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));border-inline-end:0;overflow:visible}
  .brand-box{border:0;padding:0}.brand-sub{display:none}.brand{font-size:14px}.logo{width:32px;height:32px}
  .side nav{order:3;flex-direction:row;overflow-x:auto;width:100%;gap:4px;padding-bottom:2px}
  .side nav button{width:auto;white-space:nowrap;padding:7px 11px}
  .side nav button[aria-current="true"]::before{display:none}
  .side-foot{margin:0;margin-inline-start:auto;flex-direction:row;border:0;padding:0}
  .side-btn{width:auto;padding:8px}.side-btn span{display:none}
  .pagebar{position:static}
  .bulk{top:calc(env(safe-area-inset-top,0px) + 112px)!important}
}

h2{font-family:var(--f-display);font-size:22px;margin:0 0 4px;text-wrap:balance}
.sub{color:var(--muted);margin:0 0 18px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.sp{flex:1}

.btn{border:1px solid var(--line);background:var(--surface);padding:7px 14px;border-radius:8px;font-weight:500}
.btn:hover{background:var(--surface2)}
.btn.pri{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.btn.pri:hover{filter:brightness(1.08)}
.btn.sm{padding:3px 10px;font-size:13px}
.btn.danger{color:var(--bad)}
.ghost{border:0;background:transparent;color:var(--muted);padding:4px 8px;border-radius:6px}
.ghost:hover{background:var(--surface2);color:var(--fg)}

.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-bottom:22px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
.stat b{display:block;font-size:28px;line-height:1.2;font-family:var(--f-display);font-weight:700}
.stat span{color:var(--muted);font-size:13px}
.stat.bad b{color:var(--bad)} .stat.good b{color:var(--good)}

.layout{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:20px;align-items:start}
@media (max-width:900px){.layout{grid-template-columns:minmax(0,1fr)}}
.members{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.mcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;text-align:start;display:flex;flex-direction:column;gap:12px;box-shadow:var(--shadow);min-width:0}
.mcard:hover{border-color:var(--accent)}
.mhead{display:flex;align-items:center;gap:10px;min-width:0}
.av{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-weight:700;flex:none;font-family:var(--f-display)}
.mname{font-weight:600;font-size:16px;overflow-wrap:anywhere}
.trio{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;text-align:center}
.trio div{background:var(--surface2);border-radius:8px;padding:6px 2px}
.trio b{display:block;font-size:22px;line-height:1.2}
.trio span{font-size:12px;color:var(--muted)}
.trio .open b{color:var(--warn)} .trio .fin b{color:var(--good)}
.bar{height:6px;background:var(--surface2);border-radius:9px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--good);border-radius:9px}
.mfoot{display:flex;justify-content:space-between;color:var(--muted);font-size:13px}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.panel h3{margin:0 0 10px;font-size:15px}
.up{display:flex;flex-direction:column;gap:2px}
.upi{display:flex;gap:10px;justify-content:space-between;padding:8px 6px;border-radius:8px;align-items:flex-start}
.upi+.upi{border-top:1px solid var(--line)}
.upi div{min-width:0;overflow-wrap:anywhere}
.upi small{color:var(--muted);display:block}
.empty{color:var(--muted);padding:18px;text-align:center;border:1px dashed var(--line);border-radius:var(--r)}

.chip{display:inline-block;padding:0 8px;border-radius:99px;font-size:12px;line-height:20px;background:var(--surface2);color:var(--muted);white-space:nowrap}
.chip.bad{background:var(--bad-soft);color:var(--bad)} .chip.warn{background:var(--warn-soft);color:var(--warn)}
.chip.good{background:var(--good-soft);color:var(--good)} .chip.acc{background:var(--accent-soft);color:var(--accent)}

.tools{display:grid;grid-template-columns:minmax(160px,1fr) repeat(3,minmax(120px,170px)) auto;gap:8px;margin-bottom:12px}
@media (max-width:700px){.tools{grid-template-columns:1fr 1fr}.tools input[type=search]{grid-column:1/-1}}
input,select,textarea{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:7px 10px;width:100%;min-width:0}
textarea{resize:vertical;min-height:110px}
.bulk{position:sticky;top:calc(env(safe-area-inset-top,0px) + 62px);z-index:5;background:var(--accent-soft);border:1px solid var(--accent);border-radius:var(--r);padding:8px 12px;margin-bottom:10px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.bulk select{width:auto;min-width:140px}
.task{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);margin-bottom:10px;overflow:hidden}
.thead{display:flex;gap:12px;align-items:center;padding:12px 14px;cursor:pointer;flex-wrap:wrap}
.thead:hover{background:var(--surface2)}
.ttitle{font-weight:600;flex:1;min-width:140px;overflow-wrap:anywhere}
.tprog{width:110px}
.tbody{border-top:1px solid var(--line);padding:6px 10px 12px}
.sub-row{display:grid;grid-template-columns:24px minmax(0,1fr) 150px 170px 64px;gap:8px;align-items:center;padding:7px 4px;border-bottom:1px solid var(--line)}
.sub-row:last-of-type{border-bottom:0}
@media (max-width:760px){.sub-row{grid-template-columns:24px minmax(0,1fr) 64px}.sub-row .sa,.sub-row .sd{grid-column:2/3}}
.stbtn{width:22px;height:22px;border-radius:50%;border:2px solid var(--muted);background:transparent;padding:0;display:grid;place-items:center;font-size:12px;line-height:1}
.stbtn.doing{border-color:var(--warn);background:linear-gradient(90deg,var(--warn) 50%,transparent 50%)}
.stbtn.done{border-color:var(--good);background:var(--good);color:#fff}
.st-title{overflow-wrap:anywhere;cursor:pointer}
.st-title.done{text-decoration:line-through;color:var(--muted)}
.sa select{padding:4px 8px;font-size:13px}
.sd{font-size:13px;color:var(--muted)} .sd.late{color:var(--bad);font-weight:600}
.tact{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.cb{width:auto}

.alert{display:flex;gap:12px;align-items:flex-start;justify-content:space-between;background:var(--surface);border:1px solid var(--line);border-inline-start:4px solid var(--warn);border-radius:var(--r);padding:10px 14px;margin-bottom:8px;flex-wrap:wrap}
.alert.late{border-inline-start-color:var(--bad)}
.alert .t{min-width:160px;flex:1;overflow-wrap:anywhere}
.alert small{color:var(--muted);display:block}
h3.sec{margin:20px 0 8px;font-size:15px;color:var(--muted)}

.mlist{display:grid;gap:8px}
.mrow{display:flex;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px 14px;flex-wrap:wrap}

#toasts{position:fixed;inset-inline-start:max(16px,env(safe-area-inset-left,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:60;display:flex;flex-direction:column;gap:8px;max-width:min(380px,calc(100vw - 32px))}
.toast{background:var(--fg);color:var(--bg);border-radius:10px;padding:10px 14px;box-shadow:var(--shadow);cursor:pointer;overflow-wrap:anywhere}
.toast b{display:block}
.toast.al{border-inline-start:5px solid var(--warn)}

.ov{position:fixed;inset:0;background:rgba(10,16,24,.55);z-index:50;display:grid;place-items:center;padding:16px;overflow:auto}
.ov[hidden]{display:none}
.modal{background:var(--surface);border-radius:14px;padding:20px;width:min(480px,100%);max-height:100%;overflow:auto;box-shadow:var(--shadow)}
.modal h3{margin:0 0 14px;font-family:var(--f-display);font-size:19px}
.fld{display:grid;gap:4px;margin-bottom:12px}
.fld label{font-size:13px;color:var(--muted)}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:420px){.f2{grid-template-columns:1fr}}
.hint{font-size:12px;color:var(--muted)}

.modal.wide{width:min(680px,100%)}
.fl{display:grid;gap:3px;font-size:12px;color:var(--muted)}
.grow{flex:1;min-width:0}
.subrow{border:1px solid var(--line);border-radius:8px;padding:10px;margin-bottom:8px;background:var(--bg)}
.subrow-top{display:flex;gap:6px;align-items:flex-end}
.subrow-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin-top:8px}
.subs-head{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin:14px 0 6px}
.subs-head b{font-size:15px}
.tpl{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;margin-bottom:10px}
.tpl-subs{margin:8px 0 0;padding-inline-start:22px;display:grid;gap:2px}
.tpl-subs li{overflow-wrap:anywhere}
.tpl-subs .hint{margin-inline-start:6px}

.tscroll{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.ptable{border-collapse:collapse;width:100%;min-width:700px}
.ptable th,.ptable td{padding:10px 12px;border-bottom:1px solid var(--line);text-align:center;vertical-align:middle}
.ptable th{font-size:13px;color:var(--muted);font-weight:600;background:var(--surface2)}
.ptable th:first-child,.ptable td:first-child{text-align:start}
.ptable tr:last-child td{border-bottom:0}
.ptable tr.team td{background:var(--surface2);font-weight:600}
.ptable td b{display:block;font-size:17px;line-height:1.3}
.ptable td small{display:block;color:var(--muted);font-size:12px}
.ptable .bar{margin:4px auto 0;width:70px;height:4px}
.pm{display:flex;gap:8px;align-items:center;min-width:120px}
.case-row{display:grid;grid-template-columns:22px minmax(0,1fr) 130px 170px 110px;gap:8px;align-items:center;padding:7px 4px;border-bottom:1px solid var(--line)}
.case-row:last-of-type{border-bottom:0}
@media (max-width:760px){.case-row{grid-template-columns:22px minmax(0,1fr)}.case-row>:nth-child(n+3){grid-column:2/3}}
.thead.static{cursor:default}.thead.static:hover{background:transparent}
.perf-sec{margin-top:26px}

.expopt{display:grid;gap:6px;padding:12px;border:1px solid var(--line);border-radius:10px;margin-bottom:10px;justify-items:start}

.chip.pr5{background:var(--bad-soft);color:var(--bad)}.chip.pr4{background:var(--warn-soft);color:var(--warn)}.chip.pr3{background:var(--accent-soft);color:var(--accent)}
.btn[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent);border-color:var(--accent)}
.combo{position:relative}
.combolist{position:absolute;inset-inline:0;top:100%;z-index:70;background:var(--surface);border:1px solid var(--line);border-radius:8px;box-shadow:var(--shadow);max-height:220px;overflow:auto;margin-top:4px;padding:4px;display:grid}
.copt{border:0;background:transparent;text-align:start;padding:7px 10px;border-radius:6px;display:flex;justify-content:space-between;gap:8px;overflow-wrap:anywhere}
.copt:hover,.copt:focus-visible{background:var(--surface2)}
.copt.new{color:var(--accent);font-weight:600}
.hintrow{color:var(--muted);font-size:13px;padding:7px 10px}
.cal-grid{display:grid;gap:8px;grid-template-columns:repeat(auto-fit,minmax(140px,1fr))}
.cal-grid.day{grid-template-columns:minmax(0,1fr)}
.cday{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:8px;min-width:0;display:flex;flex-direction:column;gap:6px}
.cday.today{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.chead{display:flex;gap:6px;align-items:center;flex-wrap:wrap;padding-bottom:4px;border-bottom:1px solid var(--line)}
.chead .num{color:var(--muted);font-size:13px;flex:1}
.cempty{padding:6px 2px}
.citem{display:flex;gap:8px;align-items:flex-start;background:var(--bg);border:1px solid var(--line);border-inline-start:4px solid var(--line);border-radius:8px;padding:6px 8px;min-width:0}
.citem.pr5{border-inline-start-color:var(--bad)}.citem.pr4{border-inline-start-color:var(--warn)}.citem.pr3{border-inline-start-color:var(--accent)}
.cbody{min-width:0;flex:1}
.ctitle{overflow-wrap:anywhere;font-weight:500}
.cmeta{font-size:12px;color:var(--muted);overflow-wrap:anywhere}
.cmeta .late{color:var(--bad);font-weight:600}

.donecb{width:20px;height:20px;accent-color:var(--good);cursor:pointer;margin:0;flex:none}
.rdone{background:var(--good-soft);border-radius:6px}
.citem.rdone{border-color:var(--good);border-inline-start-color:var(--good)}
.case-row.rdone{border-radius:6px}
.acts{display:flex;gap:4px;align-items:center;justify-content:flex-end}
.alchip{display:block;border:0;background:transparent;color:var(--accent);padding:0;font-size:12px;text-decoration:underline;text-align:start;cursor:pointer}
.task.fin{border-color:var(--good)}
.task.fin .thead{background:var(--good-soft)}
.frow{display:grid;grid-template-columns:minmax(0,1fr) 140px 170px;gap:8px;padding:5px 4px;border-bottom:1px solid var(--line)}
@media (max-width:760px){.frow{grid-template-columns:minmax(0,1fr)}}
.alert.upc{border-inline-start-color:var(--line)}
.alert .donecb{margin-top:3px}

h2{font-size:24px;font-weight:700;letter-spacing:-.01em}
.sub{font-size:14px}
.btn{min-height:34px;display:inline-flex;align-items:center;gap:6px}
.btn.sm{min-height:28px}
.stat{box-shadow:var(--shadow);padding:14px 16px}
.stat b{font-size:30px;letter-spacing:-.02em}
.mcard,.task,.panel,.tpl,.cday,.tscroll,.alert,.mrow{box-shadow:var(--shadow)}
.mcard{transition:border-color .15s,transform .15s}.mcard:hover{transform:translateY(-1px)}
.thead{padding:13px 16px}
.chip{font-weight:500}
input,select,textarea{border-radius:8px}
.modal{border-radius:16px}
.revcb{width:20px;height:20px;accent-color:var(--review);cursor:pointer;margin:0;flex:none}
.rvd{background:var(--review-soft);border-radius:6px}
.chip.rev{background:var(--review-soft);color:var(--review)}
.mon-row{display:grid;grid-template-columns:24px minmax(0,1fr) 140px 160px 150px;gap:8px;align-items:center;padding:7px 4px;border-bottom:1px solid var(--line)}
.mon-row:last-of-type{border-bottom:0}
@media (max-width:760px){.mon-row{grid-template-columns:24px minmax(0,1fr)}.mon-row>:nth-child(n+3){grid-column:2/3}}
.gate{display:grid;place-items:center;padding-block:48px}
.gate-card{background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:28px;width:min(400px,100%);display:grid;gap:10px;text-align:center;justify-items:center}

function mineTask(tk){const me=ROLE.me;if(!me)return false;const o=caseOwner(tk.caseId);return o===me||(!o&&(tk.assignee===me||(tk.subs||[]).some(x=>x.assignee===me)))}
const hexOf=b=>[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('');
async function pbk(pw,saltHex){const enc=new TextEncoder();const salt=new Uint8Array(saltHex.match(/../g).map(h=>parseInt(h,16)));
  const key=await crypto.subtle.importKey('raw',enc.encode(pw),'PBKDF2',false,['deriveBits']);
  return hexOf(await crypto.subtle.deriveBits({name:'PBKDF2',salt,iterations:100000,hash:'SHA-256'},key,256))}
function applyScope(){

  if(ROLE.admin){S.tasks=ALLT.slice();return}
  const mem=S.members.find(m=>m.uid&&m.uid===ROLE.uid);ROLE.me=mem?mem.id:'';
  S.tasks=ALLT.filter(mineTask)}

  if(DB)return queue(()=>DB.collection('members').doc(m.id).set({name:m.name,created:m.created||Date.now(),uid:m.uid||'',vu:m.vu||'',vs:m.vs||'',vh:m.vh||''}));persistLocal()}
function delMember(id){S.members=S.members.filter(x=>x.id!==id);
  const touched=[];S.tasks=S.tasks.map(tk=>{let ch=false;const n=JSON.parse(JSON.stringify(tk));
    if(n.assignee===id){n.assignee='';ch=true}(n.subs||[]).forEach(s=>{if(s.assignee===id){s.assignee='';ch=true}});if(ch)touched.push(n);return n});

function saveTask(tk){if(ROLE.readonly)return;enforceOwner(tk);const prev=S.tasks.find(x=>x.id===tk.id);const nowDone=isTaskDone(tk);if(nowDone&&!tk.doneAt)tk.doneAt=Date.now();if(!nowDone)tk.doneAt='';

function delCase(id){S.cases=S.cases.filter(x=>x.id!==id);const touched=[];

    else u.push({id:tk.id,tid:tk.id,sid:null,title:tk.title,parent:'',assignee:caseOwner(tk.caseId)||tk.assignee||'',due:tk.due||'',remind:tk.remind==null?30:tk.remind,status:tk.status||'todo',pr:+(tk.priority||3),caseId:tk.caseId||'',reviewed:!!tk.reviewed,revAt:tk.reviewedAt||''})}
  return u}
const isDone=u=>u.status==='done';
const isTaskDone=tk=>tk.subs&&tk.subs.length?tk.subs.every(x=>x.status==='done'):tk.status==='done';
const hasAlert=u=>!!u.due&&u.remind>=0;
const doneCb=u=>`<input type="checkbox" class="donecb" data-a="toggle-done" data-t="${esc(u.tid)}" data-s="${esc(u.sid||'')}" ${isDone(u)?'checked':''} aria-label="${t('done')}" title="${t('done')}">`;
const dueMs=u=>u.due?new Date(u.due).getTime():NaN;
const isLate=u=>!isDone(u)&&u.due&&dueMs(u)<Date.now();
const alertAt=u=>dueMs(u)-u.remind*60000;
const isAlerting=u=>!isDone(u)&&hasAlert(u)&&alertAt(u)<=Date.now();
const mName=id=>(S.members.find(m=>m.id===id)||{}).name||t('noOne');
function hue(s){let h=0;for(const c of String(s))h=(h*31+c.charCodeAt(0))%360;return h}
function avatar(name){const h=hue(name);return `<span class="av" style="background:color-mix(in srgb,hsl(${h} 70% 50%) 20%,var(--surface));color:color-mix(in srgb,hsl(${h} 70% 45%) 65%,var(--fg))">${esc((name||'?').trim().charAt(0).toUpperCase())}</span>`}
function patchUnit(tid,sid,patch){const tk=S.tasks.find(x=>x.id===tid);if(!tk)return;const n=JSON.parse(JSON.stringify(tk));
  if(sid){const s=n.subs.find(x=>x.id===sid);if(s)Object.assign(s,patch)}else Object.assign(n,patch);return n}

/* ---------- daily recurring tasks created automatically at 8:00 ---------- */
const pad2=n=>String(n).padStart(2,'0');
const dayKey=d=>d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate());
const dayLabel=d=>pad2(d.getDate())+'/'+pad2(d.getMonth()+1)+'/'+d.getFullYear();
const HOLDER=uid();let autoBusy=false,autoPause=0;
function buildFromTpl(tp,now,key,id){const who=caseOwner(tp.caseId)||(tp.assignee&&S.members.some(m=>m.id===tp.assignee)?tp.assignee:'');
  return {id,created:Date.now(),title:tp.name+' '+dayLabel(now),notes:tp.notes||'',caseId:S.cases.some(c=>c.id===tp.caseId)?tp.caseId:'',priority:tp.priority||3,
    due:dueFromRule('daily','',tp.time),remind:tp.remind==null?30:tp.remind,assignee:who,status:'todo',tplId:tp.id,tplDate:key,
    subs:(tp.subs||[]).map(x=>({id:uid(),title:x.title,assignee:who,status:'todo',due:dueFromRule('daily','',x.time),remind:x.remind==null?30:x.remind,priority:x.priority||''}))}}
async function autoRun(){
  if(ROLE.readonly||!S.ready||autoBusy||Date.now()<autoPause)return;const now=new Date();if(now.getHours()<8)return;
  const key=dayKey(now);const doneLocal=new Set(lsGet('tm_autodone',[]));
  const todo=S.templates.filter(tp=>tp.kind==='daily'&&tp.auto!==false&&!getAll().some(x=>x.tplId===tp.id&&x.tplDate===key)&&!doneLocal.has('auto-'+tp.id+'-'+key));
  if(!todo.length)return;autoBusy=true;let made=0;
  try{
    for(const tp of todo){const id='auto-'+tp.id+'-'+key;const task=buildFromTpl(tp,now,key,id);
      if(DB){
        try{const mk=DB.collection('autorun').doc(id);const r=await mk.acquire({holder:HOLDER,ttlMs:8000});if(!r.acquired)continue;
          const snap=await mk.get();const d=snap.exists?snap.data():null;if(d&&d.done)continue;
          const{id:_x,...body}=task;await DB.collection('tasks').doc(id).set(body);await mk.set({done:true,at:Date.now()});made++}
        catch(e){autoPause=Date.now()+10*60000;break}
      }else{S.tasks.push(task);persistLocal();made++}
      doneLocal.add(id)}
  }finally{autoBusy=false}
  lsSet('tm_autodone',[...doneLocal].slice(-500));
  if(made){refresh();toast(t('autoToastT'),t('autoToastB',made),{go:'tasks'})}}

function mdFmt(md){if(!md)return '';const[m,d]=md.split('-').map(Number);const l=LANG==='ar'?'ar-u-nu-latn':'en-GB';return new Intl.DateTimeFormat(l,{day:'numeric',month:'long'}).format(new Date(2000,m-1,d))}

/* ---------- modal ---------- */
function modal(html,onSubmit,wide){
  $('#modal').classList.toggle('wide',!!wide);$('#modal').innerHTML=`<form id="mf">${html}</form>`;$('#ov').hidden=false;
  const f=$('#mf');f.addEventListener('submit',e=>{e.preventDefault();const r=onSubmit(new FormData(f));if(r!==false)closeModal()});
  f.querySelector('[data-close]')?.addEventListener('click',closeModal);
  const first=f.querySelector('input:not([type=hidden]),textarea,select');if(first)setTimeout(()=>first.focus(),30)}
function closeModal(){$('#ov').hidden=true;$('#modal').innerHTML='';$('#modal').classList.remove('wide')}
const foot=(label)=>`<div class="row" style="margin-top:6px"><button class="btn pri" type="submit">${label||t('save')}</button><button class="btn" type="button" data-close>${t('cancel')}</button></div>`;
const memberOpts=v=>`<option value="">${t('noOne')}</option>`+S.members.map(m=>`<option value="${esc(m.id)}" ${m.id===v?'selected':''}>${esc(m.name)}</option>`).join('');
const remindOpts=v=>REMINDS.map(n=>`<option value="${n}" ${+v===n?'selected':''}>${t('r'+n)}</option>`).join('');
const statusOpts=v=>['todo','doing','done'].map(k=>`<option value="${k}" ${k===v?'selected':''}>${t(k)}</option>`).join('');

function subRow(mode,s){s=s||{};
  const fld=(txt,input,show)=>`<label class="fl" ${show?'':'hidden'}>${txt}${input}</label>`;
  const md=s.md?(new Date().getFullYear()+'-'+s.md):'';
  return `<div class="subrow"><div class="subrow-top"><label class="fl grow">${t('fSubTitle')}<input name="st" value="${esc(s.title)}"></label><button type="button" class="ghost" data-a="rm-subrow" title="${t('delTip')}" aria-label="${t('delTip')}">✕</button></div>
  <div class="subrow-grid">
  ${fld(t('fAssignee'),`<select name="sa">${memberOpts(s.assignee)}</select>`,mode==='task')}
  ${fld(t('fDeliver'),`<input type="datetime-local" name="sd" value="${esc(s.due)}">`,mode==='task')}
  ${fld(t('fDate'),`<input type="date" name="smd" value="${esc(md)}">`,mode==='yearly')}
  ${fld(t('fTime'),`<input type="time" name="stime" value="${esc(s.time)}">`,mode!=='task')}
  ${fld(t('fRemind'),`<select name="sr">${remindOpts(s.remind==null?30:s.remind)}</select>`,true)}
  ${fld(t('fPriority'),`<select name="sp">${prOpts(s.priority||'',true)}</select>`,true)}
  </div></div>`}
function subsBuilder(mode,list){const rows=(list&&list.length?list:[{}]).map(x=>subRow(mode,x)).join('');
  return `<div class="subs-head"><b>${t('subsTitle')}</b><span class="hint">${t('subsHint')}</span></div><div id="subrows">${rows}</div><button type="button" class="btn sm" data-a="add-subrow" data-mode="${mode}">${t('addSubRow')}</button>`}
function collectSubs(fd,mode){const st=fd.getAll('st'),sp=fd.getAll('sp'),sa=fd.getAll('sa'),sd=fd.getAll('sd'),smd=fd.getAll('smd'),stime=fd.getAll('stime'),sr=fd.getAll('sr');const out=[];
  st.forEach((raw,i)=>{const title=raw.trim();if(!title)return;
    if(mode==='task')out.push({id:uid(),title,assignee:sa[i]||'',status:'todo',due:sd[i]||'',remind:+sr[i],priority:sp[i]?+sp[i]:''});
    else out.push({title,time:stime[i]||'',md:(smd[i]||'').slice(5),remind:+sr[i],priority:sp[i]?+sp[i]:''})});return out}

function taskForm(tk,pre){const edit=!!tk;const b=tk||pre||{};const own=edit?'':caseOwner(b.caseId);ComboOwner=caseOwner(b.caseId);const solo=!(tk&&tk.subs&&tk.subs.length);
  modal(`<h3>${edit?t('mTaskEdit'):t('mTaskNew')}</h3>
  <div class="fld"><label for="f-title">${t('fTitle')}</label><input id="f-title" name="title" required value="${esc(b.title)}"></div>
  <div class="fld"><label for="f-notes">${t('fDesc')}</label><textarea id="f-notes" name="notes" style="min-height:70px">${esc(b.notes)}</textarea></div>
  ${caseCombo(b.caseId)}
  <div class="f2"><div class="fld"><label for="f-due">${t('fDue')}</label><input id="f-due" type="datetime-local" name="due" value="${esc(b.due)}"></div>
  <div class="fld"><label for="f-rem">${t('fRemind')}</label><select id="f-rem" name="remind">${remindOpts(b.remind==null?30:b.remind)}</select></div></div>
  <div class="fld"><label for="f-pr">${t('fPriority')}</label><select id="f-pr" name="priority">${prOpts(b.priority||3)}</select></div>

  <p class="hint">${t('soloHint')}</p>`:''}
  ${edit?'':subsBuilder('task',pre&&pre.subs&&pre.subs.length?pre.subs.map(x=>({...x,assignee:x.assignee||own})):[{assignee:own}])}
  ${foot()}`,fd=>{
    const n=edit?JSON.parse(JSON.stringify(tk)):{id:uid(),subs:[],created:Date.now()};
    n.title=fd.get('title').trim();n.notes=fd.get('notes').trim();n.caseId=resolveCase(fd);n.due=fd.get('due')||'';n.remind=+fd.get('remind');n.priority=+fd.get('priority')||3;
    if(solo){n.assignee=fd.get('assignee')||'';n.status=fd.get('status')||'todo'}
    if(!edit){n.subs=collectSubs(fd,'task');if(n.subs.length){n.assignee='';n.status='todo'}}
    if(!n.title)return false;open.add(n.id);saveTask(n);if(pre&&pre.go)setView('tasks')},!edit)}

/* ---------- demo data ---------- */
function loadDemo(){
  const now=Date.now(),h=x=>localISO(new Date(now+x*3600000));
  const D=I18N[LANG];
  if(!S.members.length)D.demoMembers.forEach(name=>saveMember({id:uid(),name,created:now}));
  const [a,s,m,n]=S.members.slice(0,4);
  const plan=[
    [[a,'done',-5,30],[s,'doing',0.4,15],[m,'todo',6,60],[n,'todo',30,180],[a,'todo',-2,30]],
    [[m,'done',-30,30],[s,'doing',20,30],[n,'todo',48,1440]],
    [[a,'todo',24,30],[n,'todo',3,30],[m,'todo',70,30]]];
  const mainDue=[72,120,200];
  const cids=S.cases.length?S.cases.map(c=>c.id):D.demoCases.map((name,i)=>{const id=uid();saveCase({id,name,notes:'',owner:(S.members[i]||{}).id||'',created:now+i});return id});
  D.demoTasks.forEach((dt,i)=>saveTask({id:uid(),created:now+i,caseId:cids[i%cids.length],priority:[5,3,4][i%3],title:dt.t,notes:dt.n,due:h(mainDue[i]),
    subs:dt.s.map((title,j)=>{const p=plan[i][j];return{id:uid(),title,assignee:p[0].id,status:p[1],due:h(p[2]),remind:p[3],priority:[5,4,3,2,1][j%5]}})}));
  if(!S.templates.length)[['daily',D.demoTpl.daily],['yearly',D.demoTpl.yearly]].forEach(([kind,x],i)=>saveTpl({id:uid(),kind,name:x.t,notes:'',md:x.md||'',time:x.time||'',remind:30,auto:false,created:now+i,
    subs:x.s.map(([title,k])=>kind==='daily'?{title,time:k,md:'',remind:30}:{title,time:'',md:k,remind:30})}));
}

/* ---------- alerts: sound, toasts, browser notifications ---------- */
let actx=null;
function beep(){try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();const o=actx.createOscillator(),g=actx.createGain();o.connect(g);g.connect(actx.destination);
  o.type='sine';o.frequency.value=880;g.gain.setValueAtTime(.0001,actx.currentTime);g.gain.exponentialRampToValueAtTime(.25,actx.currentTime+.02);g.gain.exponentialRampToValueAtTime(.0001,actx.currentTime+.6);o.start();o.stop(actx.currentTime+.65)}catch(e){}}
function toast(title,body,opts={}){const d=document.createElement('div');d.className='toast'+(opts.alert?' al':'');d.innerHTML=`<b>${esc(title)}</b>${esc(body||'')}`;
  d.addEventListener('click',()=>{d.remove();if(opts.go)setView(opts.go)});$('#toasts').appendChild(d);setTimeout(()=>d.remove(),opts.alert?12000:5000)}
function notify(ti,b){try{if('Notification' in window&&Notification.permission==='granted')new Notification(ti,{body:b})}catch(e){}}
function check(){
  if(!S.ready)return;const fired=new Set(lsGet('tm_fired',[]));const U=units();const fresh=[];
  for(const u of U){if(!isAlerting(u))continue;const k=u.id+'|'+u.due+'|'+u.remind;if(!fired.has(k)){fired.add(k);fresh.push(u)}}
  if(!fresh.length)return;lsSet('tm_fired',[...fired].slice(-2000));beep();
  if(fresh.length<=3)fresh.forEach(u=>{const body=(u.assignee?mName(u.assignee)+' · ':'')+(isLate(u)?t('pastDue',fmt(u.due)):t('dueAt',fmt(u.due)));toast(u.title,body,{alert:true,go:'alerts'});notify(u.title,body)});
  else{toast(t('newAlerts',fresh.length),t('tapView'),{alert:true,go:'alerts'});notify(t('newAlerts',fresh.length),t('openToView'))}
  refresh()}

    sections.push({h:t('sh_summary'),cols:[t('xCase'),t('xOwner'),t('sMain'),t('sUnits'),t('xOpen'),t('xFin'),t('xLate'),t('xPct')],rows:list.map(c=>{const us=U.filter(u=>u.caseId===c.id);const f=us.filter(isDone).length;return[c.name,c.owner&&caseOwner(c.id)?mName(c.owner):'',S.tasks.filter(x=>x.caseId===c.id).length,us.length,us.length-f,f,us.filter(isLate).length,pct(f,us.length)]})});
    list.forEach(c=>{const us=ordered().filter(u=>u.caseId===c.id);sections.push({h:c.name,cols:[t('xTask'),t('xSub'),t('xOwner'),t('xPriority'),t('xStatus'),t('xDeadline')],rows:us.map(u=>[tn(u),sn(u),own(u),u.pr,stText(u),dueTxt(u.due)])});
      const rc=S.templates.filter(x=>x.caseId===c.id);if(rc.length)sections.push({h:c.name+' · '+t('caseRecTitle'),cols:[t('xKind'),t('xName'),t('xWhen'),t('xAuto')],rows:rc.map(tp=>[t(tp.kind==='daily'?'recDaily':'recYearly'),tp.name,ruleText(tp.kind,tp.md,tp.time),tp.kind==='daily'&&tp.auto!==false?t('yes'):t('no')])})});break}

  }

function buildWorkbook(){
  const X=window.XLSX;const U=units();const wb=X.utils.book_new();
  const sheet=(name,rows,widths)=>{const ws=X.utils.aoa_to_sheet(rows);ws['!cols']=widths.map(w=>({wch:w}));X.utils.book_append_sheet(wb,ws,name)};
  const rem=n=>t('r'+(n==null?30:n));
  // tasks
  const tr=[[t('xCase'),t('xTask'),t('xTaskDue'),t('xSub'),t('xOwner'),t('xStatus'),t('xLate'),t('xSubDue'),t('xAlert'),t('xPriority'),t('xNotes')]];
  for(const tk of S.tasks){const cn=caseName(tk.caseId);
    if(tk.subs&&tk.subs.length)tk.subs.forEach(sb=>{const u={status:sb.status||'todo',due:sb.due||''};tr.push([cn,tk.title,dueTxt(tk.due),sb.title,(caseOwner(tk.caseId)||sb.assignee)?mName(caseOwner(tk.caseId)||sb.assignee):'',t(u.status),isLate(u)?t('yes'):t('no'),dueTxt(sb.due),rem(sb.remind),sb.priority||tk.priority||3,tk.notes||''])});
    else{const u={status:tk.status||'todo',due:tk.due||''};tr.push([cn,tk.title,dueTxt(tk.due),'',(caseOwner(tk.caseId)||tk.assignee)?mName(caseOwner(tk.caseId)||tk.assignee):'',t(u.status),isLate(u)?t('yes'):t('no'),'',rem(tk.remind),tk.priority||3,tk.notes||''])}}
  sheet(t('shTasks'),tr,[22,30,18,30,18,14,10,18,18,10,30]);
  // members
  const mr=[[t('xMember'),t('xAssigned'),t('xOpen'),t('xFin'),t('xLate'),t('xPct')]];
  S.members.forEach(m=>{const us=U.filter(u=>u.assignee===m.id);const f=us.filter(isDone).length;mr.push([m.name,us.length,us.length-f,f,us.filter(isLate).length,us.length?Math.round(f/us.length*100):''])});
  sheet(t('shMembers'),mr,[24,12,12,12,12,16]);
  // rates
  const P=periods();const hr=[t('xMember')];P.forEach(p=>{hr.push(t(p[0])+' - '+t('xTasksN'),t(p[0])+' - '+t('xFin'),t(p[0])+' - %')});const rr=[hr];
  S.members.forEach(m=>{const us=U.filter(u=>u.assignee===m.id);const row=[m.name];P.forEach(p=>row.push(...periodStats(us,p[1],p[2])));rr.push(row)});
  const tot=[t('perfTeam')];P.forEach(p=>tot.push(...periodStats(U,p[1],p[2])));rr.push(tot);
  sheet(t('shRates'),rr,[24,...P.flatMap(()=>[14,14,10])]);
  // cases
  const cr=[[t('xCase'),t('xOwner'),t('sMain'),t('sUnits'),t('xOpen'),t('xFin'),t('xLate'),t('xPct')]];
  S.cases.forEach(c=>{const ts=S.tasks.filter(x=>x.caseId===c.id);const ids=new Set(ts.map(x=>x.id));const us=U.filter(u=>ids.has(u.tid));const f=us.filter(isDone).length;
    cr.push([c.name,c.owner?mName(c.owner):'',ts.length,us.length,us.length-f,f,us.filter(isLate).length,us.length?Math.round(f/us.length*100):''])});
  sheet(t('shCases'),cr,[28,18,14,14,12,12,12,16]);
  // recurring
  const rc=[[t('xKind'),t('xName'),t('xWhen'),t('xNotes'),t('xSub'),t('xWhen'),t('xAlert'),t('xCase'),t('xOwner')]];
  S.templates.forEach(tp=>{const k=t(tp.kind==='daily'?'recDaily':'recYearly');
    if((tp.subs||[]).length)tp.subs.forEach(sb=>rc.push([k,tp.name,ruleText(tp.kind,tp.md,tp.time),tp.notes||'',sb.title,ruleText(tp.kind,sb.md,sb.time),rem(sb.remind),caseName(tp.caseId),(caseOwner(tp.caseId)||tp.assignee)?mName(caseOwner(tp.caseId)||tp.assignee):'']));
    else rc.push([k,tp.name,ruleText(tp.kind,tp.md,tp.time),tp.notes||'','','',rem(tp.remind),caseName(tp.caseId),(caseOwner(tp.caseId)||tp.assignee)?mName(caseOwner(tp.caseId)||tp.assignee):''])});
  sheet(t('shRecurring'),rc,[20,30,18,30,30,18,18,22,18]);
  wb.Workbook={Views:[{RTL:LANG==='ar'}]};
  return wb}

let FBA=null,FS=null,UNSUBS=[];
DL={save:async({filename,data})=>{const b=data instanceof Blob?data:new Blob([data]);const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=filename;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1500)}};
const _al=applyLang;applyLang=function(){_al();const o=$('#outbtn');if(o)o.textContent=sa('out')};
function adapter(fs){return{collection(c){const mk=q=>({orderBy:f=>mk(q.orderBy(f)),onSnapshot:(ok,err)=>q.onSnapshot(ok,err)});
  const b=mk(fs.collection(c));b.doc=id=>{const r=fs.collection(c).doc(id);return{set:d=>r.set(JSON.parse(JSON.stringify(d))),get:()=>r.get(),delete:()=>r.delete(),
   acquire:async({holder,ttlMs})=>{const l=fs.collection(c).doc(id+'__lock');return fs.runTransaction(async tx=>{const sn=await tx.get(l);const n=Date.now();if(sn.exists&&sn.data().until>n&&sn.data().holder!==holder)return{acquired:false};tx.set(l,{holder,until:n+ttlMs});return{acquired:true}})}}};return b}}}
const mailOf=u=>u+'@'+MAILDOM;
const okUser=u=>/^[a-z0-9._-]{2,30}$/.test(u);
window.renderLogin=function(msg){document.body.classList.add('loggedout');
  if(!FB_OK){$('#view').innerHTML=`<div class="gate"><h2>${sa('needCfg')}</h2><p class="sub">${sa('needCfgP')}</p></div>`;return}
  $('#view').innerHTML=`<div class="gate"><h2>${sa('loginT')}</h2><form id="fblogin"><label>${sa('user')}<input id="fu" autocomplete="username" autocapitalize="none" required></label><label>${sa('pass')}<input id="fp" type="password" autocomplete="current-password" required></label><span class="hint" id="fe" style="color:var(--bad)">${esc(msg||'')}</span><button class="btn pri" type="submit">${sa('go')}</button></form><button class="btn sm" type="button" id="fbsetup">${sa('setupLink')}</button></div>`};
function stopAll(){UNSUBS.forEach(f=>{try{f()}catch(e){}});UNSUBS=[]}
function startData(){
  DB=adapter(FS);S.shared=true;let gotM=false,gotT=false,gotP=false,gotC=false;S.ready=false;
  const ready=()=>{if(gotM&&gotT&&gotP&&gotC&&!S.ready)S.ready=true;applyScope();refresh();check();autoRun()};
  const sub=(c,set,flag)=>UNSUBS.push(DB.collection(c).orderBy('created').onSnapshot(snap=>{set(snap.docs.map(d=>({id:d.id,...d.data()})));flag();ready()},e=>{console.warn(c,e);flag();ready()}));
  sub('members',v=>{S.members=v},()=>{gotM=true});sub('tasks',v=>{ALLT=v},()=>{gotT=true});sub('templates',v=>{S.templates=v},()=>{gotP=true});sub('cases',v=>{S.cases=v},()=>{gotC=true})}
gateHTML=function(){$('#view').innerHTML=`<div class="gate"><h2>${g('gT')}</h2><p class="sub">${sa('noLink')}</p></div>`};
accountsHTML=function(){return `<hr class="sep"><div class="row"><div><h2>${sa('acct')}</h2><p class="sub">${sa('acctSub')}</p></div></div><div class="mlist">${S.members.map(m=>`<div class="claimrow"><b style="flex:1">${esc(m.name)}</b>${m.uid?`<span class="chip good">${sa('has')}${m.vu?': '+esc(m.vu):''}</span><button class="btn sm" data-a="unlink" data-id="${esc(m.id)}">${sa('unlinkB')}</button>`:`<button class="btn sm pri" data-a="set-cred" data-id="${esc(m.id)}">${sa('create')}</button>`}</div>`).join('')}</div><p class="hint">${sa('pwNote')}</p>`};
credForm=function(m){
  modal(`<h3>${sa('credT')} ${esc(m.name)}</h3><p class="sub">${sa('credP')}</p><div class="fld"><label for="f-vu">${sa('user')}</label><input id="f-vu" name="vu" autocapitalize="none" required></div><div class="fld"><label for="f-vp">${sa('pass')}</label><input id="f-vp" name="vp" autocomplete="new-password" required></div><span class="hint" id="f-verr" style="color:var(--bad)"></span>${foot(sa('create'))}`,fd=>{
    const vu=fd.get('vu').trim().toLowerCase(),vp=fd.get('vp');const er=$('#f-verr');
    if(!okUser(vu)){er.textContent=sa('badUser');return false}if(vp.length<6){er.textContent=sa('weak');return false}
    (async()=>{try{const sec=firebase.apps.find(a=>a.name==='sec')||firebase.initializeApp(FB_CONFIG,'sec');
      const c=await sec.auth().createUserWithEmailAndPassword(mailOf(vu),vp);await sec.auth().signOut();
      saveMember({...m,uid:c.user.uid,vu});closeModal()}
     catch(e){const er2=$('#f-verr');if(er2)er2.textContent=(e&&e.code==='auth/email-already-in-use')?sa('taken'):((e&&e.code==='auth/weak-password')?sa('weak'):String(e&&e.message||e))}})();return false})};
document.addEventListener('submit',async e=>{if(e.target.id!=='fblogin')return;e.preventDefault();
  const u=$('#fu').value.trim().toLowerCase(),p=$('#fp').value;
  try{await FBA.signInWithEmailAndPassword(mailOf(u),p)}catch(x){renderLogin(sa('bad'))}});
document.addEventListener('click',async e=>{
  if(e.target.id==='outbtn'){FBA.signOut();return}
  if(e.target.id==='fbsetup'){const u=($('#fu').value||'').trim().toLowerCase(),p=$('#fp').value;const er=$('#fe');
    if(!okUser(u)){er.textContent=sa('badUser');return}if(p.length<6){er.textContent=sa('weak');return}
    try{const c=await FBA.createUserWithEmailAndPassword(mailOf(u),p);
      try{await FS.doc('config/admin').set({uid:c.user.uid,created:Date.now()});handleUser(c.user)}
      catch(x){try{await c.user.delete()}catch(y){}renderLogin(sa('adminDone'))}}
    catch(x){renderLogin(x&&x.code==='auth/email-already-in-use'?sa('taken'):String(x&&x.message||x))}}});
(async function boot(){
  if(!FB_OK){ROLE.needLogin=true;S.ready=true;refresh();return}
  FBA=firebase.initializeApp(FB_CONFIG)&&firebase.auth();FS=firebase.firestore();
  ROLE.needLogin=true;S.ready=true;refresh();
  window.handleUser=async function(user){
    stopAll();
    if(!user){ROLE.needLogin=true;ROLE.admin=false;ROLE.me='';ROLE.uid='';S.members=[];ALLT=[];S.tasks=[];S.templates=[];S.cases=[];S.ready=true;
      document.body.classList.add('loggedout');$('#outbtn').hidden=true;refresh();return}
    ROLE.needLogin=false;ROLE.uid=user.uid;ROLE.me='';
    try{const a=await FS.doc('config/admin').get();ROLE.admin=!!(a.exists&&a.data().uid===user.uid)}catch(e){ROLE.admin=false}
    document.body.classList.remove('loggedout');document.body.classList.toggle('member',!ROLE.admin);$('#outbtn').hidden=false;
    applyLang();if(!navViews().includes(view))view='home';setView(view);startData()};
  FBA.onAuthStateChanged(handleUser);
})();
</script>
