function tciBuild(){const tb=TCI.tables[TCI.sel];if(!tb)return[];const out=[];const rows=tb.rows.slice(TCI.hdr?1:0);const ci=TCI.roles.indexOf('item'),cc=TCI.roles.indexOf('cur'),cp=TCI.roles.indexOf('prop');
  rows.forEach(r=>{const it=ci>=0?(r[ci]||{text:''}).text.replace(/\n+/g,' ').trim():'',cur=cc>=0?(r[cc]||{lines:[],text:''}):{lines:[],text:''},pr=cp>=0?(r[cp]||{lines:[],text:''}):{lines:[],text:''};
    if(!it&&!cur.text&&!pr.text)return;
    const items=TCI.split?tciSplit(cur.lines):[];
    if(items.length>=2){const pItems=TCI.split?tciSplit(pr.lines):[];const short=pr.text&&pr.text.length<=40&&pItems.length<2;
      items.forEach((x,i)=>out.push({item:[it,x.head].filter(Boolean).join(' – '),text:x.text,prop:short?pr.text:(pItems.length===items.length?pItems[i].text:(i===0?pr.text:''))}))}
    else out.push({item:it,text:cur.text,prop:pr.text})});
  return out}
function tciModal(gid){const pr=getProf(CASE);const groups=tcGroups(pr);if(!groups.some(x=>x.id===gid))return;TCI={g:gid,tables:null,sel:0,roles:[],hdr:false,split:true,mode:'append',off:new Set()};
  modal(`<h3>⬆ ${g('tci_title')}</h3><div id="tci"></div>`,()=>false,true);tciRender()}
function tciRender(){const el=document.querySelector('#tci');if(!el||!TCI)return;const pr=getProf(CASE);const groups=tcGroups(pr);const Gp=groups.find(x=>x.id===TCI.g)||groups[0];
  if(!TCI.tables){el.innerHTML=`<p class="hint">${g('tci_pick')}</p><div class="row"><button type="button" class="btn pri" data-a="tci-file">⬆ ${g('tci_upload')}</button><input type="file" id="tci-file" accept=".docx,.xlsx,.xlsm,.csv,.tsv,.txt" hidden></div>
    <div id="tci-paste" class="tci-paste" contenteditable="true" role="textbox" data-ph="${esc(g('tci_paste'))}"></div><div class="row" style="margin-top:8px"><button type="button" class="btn" data-close>${t('cancel')}</button></div>`;return}
  const tb=TCI.tables[TCI.sel];const n=Math.max(...tb.rows.map(r=>r.length));const list=tciBuild();
  const incl=list.filter((_,i)=>!TCI.off.has(i)).length;
  const roleSel=i=>`<select class="tci-role" data-i="${i}">${[['ign','tci_r_ign'],['item','tci_r_item'],['cur','tci_r_cur'],['prop','tci_r_prop']].map(([v,k])=>`<option value="${v}" ${TCI.roles[i]===v?'selected':''}>${g(k)}</option>`).join('')}</select>`;
  const sampleHdr=tb.rows[0]||[];
  el.innerHTML=`<div class="f2"><div class="fld"><label>${g('tci_target')}</label><select id="tci-g">${groups.map(x=>`<option value="${esc(x.id)}" ${x.id===TCI.g?'selected':''}>${esc(x.title)}</option>`).join('')}</select></div>
    <div class="fld"><label>${g('tci_table')}</label><select id="tci-t">${TCI.tables.map((x,i)=>`<option value="${i}" ${i===TCI.sel?'selected':''}>${x.kind==='list'?g('tci_list')+' ('+x.rows.length+')':g('tci_tbl',i+1-(TCI.tables.slice(0,i).filter(y=>y.kind==='list').length),x.rows.length)}</option>`).join('')}</select></div></div>
   ${tb.kind==='table'?`<div class="tci-opts"><label class="chk"><input type="checkbox" id="tci-hdr" ${TCI.hdr?'checked':''}> ${g('tci_hdr')}</label></div><div class="hint">${g('tci_cols')}</div><div class="tci-cols">${Array.from({length:n},(_,i)=>`<div><small>${esc((sampleHdr[i]&&sampleHdr[i].text||('#'+(i+1))).slice(0,28))}</small>${roleSel(i)}</div>`).join('')}</div>`:''}
   <div class="tci-opts"><label class="chk"><input type="checkbox" id="tci-split" ${TCI.split?'checked':''}> ${g('tci_split')}</label>
    <span class="tci-mode">${g('tci_mode')}: <label class="chk"><input type="radio" name="tcimode" value="append" ${TCI.mode==='append'?'checked':''}> ${g('tci_append')}</label> <label class="chk"><input type="radio" name="tcimode" value="replace" ${TCI.mode==='replace'?'checked':''}> ${g('tci_replace')}</label></span></div>
   <h4 style="margin:10px 0 4px">${g('tci_prev')} <span class="chip num">${g('tci_count',incl)}</span></h4>
   <div class="tci-prev"><table class="tctbl"><thead><tr><th>✓</th><th class="tcn">#</th><th>${g('tc_item')}</th><th>${g('tc_cur')}</th><th>${g('tc_prop')}</th></tr></thead><tbody>${list.slice(0,150).map((x,i)=>`<tr class="${TCI.off.has(i)?'tcdone':''}"><td><input type="checkbox" class="tci-inc" data-i="${i}" ${TCI.off.has(i)?'':'checked'}></td><td class="tcn num">${(TCI.mode==='append'?tcRows(pr,TCI.g).length:0)+list.slice(0,i+1).filter((_,j)=>!TCI.off.has(j)).length}</td><td class="tcitem">${esc(x.item)}</td><td class="tctext">${esc(x.text.length>260?x.text.slice(0,258)+'…':x.text)}</td><td class="tctext">${esc(x.prop.length>160?x.prop.slice(0,158)+'…':x.prop)}</td></tr>`).join('')}</tbody></table></div>
   ${list.length>150?`<p class="hint">+${list.length-150}</p>`:''}<p class="hint">${g('tci_fmt')}</p>
   <div class="row" style="margin-top:8px"><button type="button" class="btn pri" data-a="tci-go" ${incl?'':'disabled'}>${g('tci_go',incl)}</button><button type="button" class="btn" data-a="tci-back">${g('tci_back')}</button><button type="button" class="btn" data-close>${t('cancel')}</button></div>`}
function tciLoaded(tables){if(!tables||!tables.length){toast(g('tci_title'),g('tci_none'),{alert:true});return}
  tables.sort((a,b)=>(a.kind==='list')-(b.kind==='list'));TCI.tables=tables;TCI.sel=0;tciPick(0);TCI.off=new Set();tciRender()}
function tciPick(i){TCI.sel=i;const d=tciDefaults(TCI.tables[i]);TCI.roles=d.roles;TCI.hdr=d.hdr;TCI.off=new Set();if(TCI.tables[i].kind==='list')TCI.roles=['cur']}
document.addEventListener('click',e=>{const el=e.target.closest&&e.target.closest('[data-a]');if(!el||!ROLE.admin)return;const a=el.dataset.a;
  if(a==='tci-open')tciModal(el.dataset.g);
  else if(a==='tci-file'){const f=document.querySelector('#tci-file');if(f)f.click()}
  else if(a==='tci-back'){TCI.tables=null;tciRender()}
  else if(a==='tci-go'&&TCI){const list=tciBuild().filter((_,i)=>!TCI.off.has(i));if(!list.length)return;const np=JSON.parse(JSON.stringify(getProf(CASE)));np.tc=np.tc||[];
    if(TCI.mode==='replace')np.tc=np.tc.filter(r=>r.g!==TCI.g);
    list.forEach(x=>np.tc.push({id:uid(),g:TCI.g,item:x.item,text:x.text,prop:x.prop,d:'',d_r:1440,d_p:3,done:false}));saveProf(CASE,np);
    const gp=tcGroups(np).find(x=>x.id===TCI.g);closeModal();toast(g('tci_title'),g('tci_done',list.length,gp?gp.title:''))}});
document.addEventListener('change',async e=>{const el=e.target;if(!TCI||!el||!document.querySelector('#tci'))return;
  if(el.id==='tci-file'){const f=el.files&&el.files[0];if(!f)return;try{tciLoaded(await tciReadFile(f))}catch(x){console.warn(x);toast(g('tci_title'),g('tci_err'),{alert:true})}}
  else if(el.id==='tci-g'){TCI.g=el.value;TCI.off=new Set();tciRender()}
  else if(el.id==='tci-t'){tciPick(+el.value);tciRender()}
  else if(el.id==='tci-hdr'){TCI.hdr=el.checked;TCI.off=new Set();tciRender()}
  else if(el.id==='tci-split'){TCI.split=el.checked;TCI.off=new Set();tciRender()}
  else if(el.name==='tcimode'){TCI.mode=el.value;tciRender()}
  else if(el.classList.contains('tci-role')){TCI.roles[+el.dataset.i]=el.value;TCI.off=new Set();tciRender()}
  else if(el.classList.contains('tci-inc')){const i=+el.dataset.i;if(el.checked)TCI.off.delete(i);else TCI.off.add(i);tciRender()}});
document.addEventListener('paste',e=>{const box=e.target.closest&&e.target.closest('#tci-paste');if(!box||!TCI)return;e.preventDefault();const cd=e.clipboardData;if(!cd)return;
  const html=cd.getData('text/html'),tx=cd.getData('text/plain');let tables=[];
  try{if(html&&/<(table|li|p|div)/i.test(html))tables=tciParseHTML(html);if(!tables.length&&tx)tables=tciParsePlain(tx)}catch(x){console.warn(x)}
  tciLoaded(tables)});
document.addEventListener('dragover',e=>{if(TCI&&e.target.closest&&e.target.closest('#tci-paste'))e.preventDefault()});
document.addEventListener('drop',async e=>{if(!TCI||!(e.target.closest&&e.target.closest('#tci-paste')))return;e.preventDefault();const f=e.dataTransfer&&e.dataTransfer.files&&e.dataTransfer.files[0];if(f){try{tciLoaded(await tciReadFile(f))}catch(x){toast(g('tci_title'),g('tci_err'),{alert:true})}}});

function adapter(fs){return{collection(c){const mk=q=>({orderBy:f=>mk(q.orderBy(f)),onSnapshot:(ok,err)=>q.onSnapshot(ok,err)});
  const b=mk(fs.collection(c));b.doc=id=>{const r=fs.collection(c).doc(id);return{set:d=>r.set(JSON.parse(JSON.stringify(d))),update:d=>r.update(JSON.parse(JSON.stringify(d))),get:()=>r.get(),delete:()=>r.delete(),
   acquire:async({holder,ttlMs})=>{const l=fs.collection(c).doc(id+'__lock');return fs.runTransaction(async tx=>{const sn=await tx.get(l);const n=Date.now();if(sn.exists&&sn.data().until>n&&sn.data().holder!==holder)return{acquired:false};tx.set(l,{holder,until:n+ttlMs});return{acquired:true}})}}};return b}}}
const mailOf=u=>u+'@'+MAILDOM;
const okUser=u=>/^[a-z0-9._-]{2,30}$/.test(u);
window.renderLogin=function(msg){document.body.classList.add('loggedout');
  if(!FB_OK){$('#view').innerHTML=`<div class="gate"><h2>${sa('needCfg')}</h2><p class="sub">${sa('needCfgP')}</p></div>`;return}
  $('#view').innerHTML=`<div class="gate"><h2>${sa('loginT')}</h2><form id="fblogin"><label>${sa('user')}<input id="fu" autocomplete="username" autocapitalize="none" required></label><label>${sa('pass')}<input id="fp" type="password" autocomplete="current-password" required></label><span class="hint" id="fe" style="color:var(--bad)">${esc(msg||'')}</span><button class="btn pri" type="submit">${sa('go')}</button></form><button class="btn sm" type="button" id="fbsetup">${sa('setupLink')}</button></div>`};
function stopAll(){UNSUBS.forEach(f=>{try{f()}catch(e){}});UNSUBS=[]}
function startData(){
  DB=adapter(FS);S.shared=true;let gotM=false,gotT=false,gotP=false,gotC=false;S.ready=false;
  const ready=()=>{if(gotM&&gotT&&gotP&&gotC&&!S.ready)S.ready=true;applyScope();refresh();check();autoRun()};
  const sub=(c,set,flag)=>UNSUBS.push(DB.collection(c).orderBy('created').onSnapshot(snap=>{set(snap.docs.map(d=>({id:d.id,...d.data()})));flag();ready()},e=>{console.warn(c,e);flag();ready()}));
  sub('members',v=>{S.members=v},()=>{gotM=true});sub('tasks',v=>{setTasksFromList(v)},()=>{gotT=true});UNSUBS.push(DB.collection('comments').orderBy('at').onSnapshot(sn=>{CM=sn.docs.map(d=>({id:d.id,...d.data()}));cmNotify();refresh();refreshThread()},e=>console.warn('comments',e)));sub('templates',v=>{S.templates=v},()=>{gotP=true});sub('cases',v=>{S.cases=v},()=>{gotC=true});UNSUBS.push(...subscribeExtras());loadPrefs()}
gateHTML=function(){$('#view').innerHTML=`<div class="gate"><h2>${g('gT')}</h2><p class="sub">${sa('noLink')}</p></div>`};
accountsHTML=function(){return `<hr class="sep"><div class="row"><div><h2>${sa('acct')}</h2><p class="sub">${sa('acctSub')}</p></div></div><div class="mlist">${S.members.map(m=>`<div class="claimrow"><b style="flex:1">${esc(m.name)}</b>${m.uid?`<span class="chip good">${sa('has')}${m.vu?': '+esc(m.vu):''}</span><button class="btn sm" data-a="unlink" data-id="${esc(m.id)}">${sa('unlinkB')}</button>`:`<button class="btn sm pri" data-a="set-cred" data-id="${esc(m.id)}">${sa('create')}</button>`}</div>`).join('')}</div><p class="hint">${sa('pwNote')}</p>`};
credForm=function(m){
  modal(`<h3>${sa('credT')} ${esc(m.name)}</h3><p class="sub">${sa('credP')}</p><div class="fld"><label for="f-vu">${sa('user')}</label><input id="f-vu" name="vu" autocapitalize="none" required></div><div class="fld"><label for="f-vp">${sa('pass')}</label><input id="f-vp" name="vp" autocomplete="new-password" required></div><span class="hint" id="f-verr" style="color:var(--bad)"></span>${foot(sa('create'))}`,fd=>{
    const vu=fd.get('vu').trim().toLowerCase(),vp=fd.get('vp');const er=$('#f-verr');
    if(!okUser(vu)){er.textContent=sa('badUser');return false}if(vp.length<6){er.textContent=sa('weak');return false}

     catch(e){const er2=$('#f-verr');if(er2)er2.textContent=(e&&e.code==='auth/email-already-in-use')?sa('taken'):((e&&e.code==='auth/weak-password')?sa('weak'):String(e&&e.message||e))}})();return false})};
document.addEventListener('submit',async e=>{if(e.target.id!=='fblogin')return;e.preventDefault();

      catch(x){try{await c.user.delete()}catch(y){}renderLogin(sa('adminDone'))}}
    catch(x){renderLogin(x&&x.code==='auth/email-already-in-use'?sa('taken'):String(x&&x.message||x))}}});
(async function boot(){
  if(!FB_OK){ROLE.needLogin=true;S.ready=true;refresh();return}
  FBA=firebase.initializeApp(FB_CONFIG)&&firebase.auth();FS=firebase.firestore();
  ROLE.needLogin=true;S.ready=true;refresh();
  window.handleUser=async function(user){
    stopAll();
    if(!user){ROLE.needLogin=true;ROLE.admin=false;ROLE.me='';ROLE.uid='';S.members=[];ALLT=[];DELT=[];CM=[];PROF={};FILES=[];CMINIT=false;SH=null;S.tasks=[];S.templates=[];S.cases=[];S.ready=true;
      document.body.classList.add('loggedout');$('#outbtn').hidden=true;refresh();return}

})();
