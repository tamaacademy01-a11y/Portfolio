<title>Portfolio Management System</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap">
<style>
/* Layout: dark navy sidebar (navigation + tools) and a light content area; mobile collapses the sidebar into a top bar */
:root{
  --bg:#f2f5f9; --surface:#ffffff; --surface2:#ecf0f6; --line:#dae1eb;
  --fg:#0e1a2c; --muted:#58687e; --accent:#1c4fd6; --accent-fg:#ffffff; --accent-soft:#e2eaff;
  --good:#12803f; --good-soft:#dcf3e5; --warn:#a35f00; --warn-soft:#fdf0d4; --bad:#c22a30; --bad-soft:#fde4e4;
  --review:#7a3ee0; --review-soft:#efe6ff;
  --side-bg:#0e1a2c; --side-fg:#b6c2d6; --side-hi:#ffffff; --side-line:rgba(255,255,255,.1); --side-accent:#6f95ff;
  --shadow:0 1px 2px rgba(14,26,44,.05),0 4px 16px rgba(14,26,44,.05);
  --f-body:"IBM Plex Sans Arabic",system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;
  --f-display:"IBM Plex Sans Arabic",system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;
  --r:12px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0a111b; --surface:#121b29; --surface2:#1a2536; --line:#243247;
  --fg:#e5ebf5; --muted:#8c9db5; --accent:#7a9dff; --accent-fg:#081022; --accent-soft:#1d2b50;
  --good:#52c27a; --good-soft:#12301f; --warn:#eeb04c; --warn-soft:#382a0e; --bad:#ff7a7f; --bad-soft:#3b1a1d;
  --review:#b69cff; --review-soft:#2a2046;
  --side-bg:#070c14; --side-fg:#97a9c4; --side-hi:#ffffff; --side-line:rgba(255,255,255,.08); --side-accent:#7a9dff;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 4px 16px rgba(0,0,0,.28); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0a111b; --surface:#121b29; --surface2:#1a2536; --line:#243247;
  --fg:#e5ebf5; --muted:#8c9db5; --accent:#7a9dff; --accent-fg:#081022; --accent-soft:#1d2b50;
  --good:#52c27a; --good-soft:#12301f; --warn:#eeb04c; --warn-soft:#382a0e; --bad:#ff7a7f; --bad-soft:#3b1a1d;
  --review:#b69cff; --review-soft:#2a2046;
  --side-bg:#070c14; --side-fg:#97a9c4; --side-hi:#ffffff; --side-line:rgba(255,255,255,.08); --side-accent:#7a9dff;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 4px 16px rgba(0,0,0,.28); color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.6;margin:0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--side-bg);z-index:30}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.ic{flex:none}

.shell{display:grid;grid-template-columns:240px minmax(0,1fr);min-height:100vh;min-height:100dvh}
.side{background:var(--side-bg);color:var(--side-fg);display:flex;flex-direction:column;gap:20px;padding:20px 14px;padding-top:calc(20px + env(safe-area-inset-top,0px));position:sticky;top:0;height:100vh;height:100dvh;overflow-y:auto;border-inline-end:1px solid var(--side-line)}
.brand-box{display:flex;gap:11px;align-items:center;padding:4px 8px 16px;border-bottom:1px solid var(--side-line)}
.logo{width:38px;height:38px;border-radius:10px;background:var(--side-accent);color:#0b1426;display:grid;place-items:center;flex:none}
.brand{margin:0;font-size:15px;font-weight:700;color:var(--side-hi);line-height:1.3}
.brand-sub{display:block;font-size:12px;color:var(--side-fg);margin-top:2px}
.brand-by{display:block;font-size:11px;color:var(--side-fg);opacity:.85;margin-top:3px;font-style:italic}
.side nav{display:flex;flex-direction:column;gap:2px;margin:0}
.side nav button,.side-btn{display:flex;gap:11px;align-items:center;width:100%;border:0;background:transparent;color:var(--side-fg);padding:9px 12px;border-radius:9px;font-weight:500;text-align:start;position:relative}
.side nav button:hover,.side-btn:hover{background:rgba(255,255,255,.07);color:var(--side-hi)}
.side nav button[aria-current="true"]{background:rgba(255,255,255,.12);color:var(--side-hi);font-weight:600}
.side nav button[aria-current="true"]::before{content:"";position:absolute;inset-inline-start:-14px;top:8px;bottom:8px;width:3px;border-radius:3px;background:var(--side-accent)}
.side nav .badge{margin-inline-start:auto}
.side-foot{margin-top:auto;display:flex;flex-direction:column;gap:2px;border-top:1px solid var(--side-line);padding-top:12px}
.whoami{display:flex;align-items:center;gap:10px;padding:10px 12px;margin-top:6px;border-top:1px solid var(--side-line);color:var(--side-hi)}.whoami .av{width:34px;height:34px;border-radius:50%;background:var(--side-accent);color:#0b1426;display:grid;place-items:center;font-weight:700;flex:none}.whoami b{display:block;font-size:13px;line-height:1.25}.whoami small{display:block;font-size:11px;opacity:.75}
@media (max-width:900px){.whoami{display:none}}
.badge{background:var(--bad);color:#fff;border-radius:99px;font-size:12px;min-width:20px;padding:0 6px;text-align:center;line-height:20px}
.badge[hidden]{display:none}
.content{min-width:0;max-width:100vw;display:flex;flex-direction:column;overflow-x:clip}
.pagebar{display:flex;align-items:center;gap:10px;padding-block:11px;background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:15;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.crumb{color:var(--muted);font-size:13px;font-weight:500}
main{width:100%;max-width:1480px;min-width:0;margin:0;padding-block:22px 90px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
@media (min-width:901px){.pagebar{padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px))}
  main{padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px))}}
@media (max-width:900px){
  .shell{display:block}
  .side{position:sticky;top:env(safe-area-inset-top,0px);height:auto;z-index:20;flex-direction:row;flex-wrap:wrap;align-items:center;gap:8px 12px;padding-block:10px;
    padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));border-inline-end:0;overflow:visible}
  .brand-box{border:0;padding:0}.brand-sub{display:none}.brand-by{font-size:10px;margin-top:1px}.brand{font-size:14px}.logo{width:32px;height:32px}
  .side nav{order:3;flex-direction:row;overflow-x:auto;width:100%;gap:4px;padding-bottom:2px}
  .side nav button{width:auto;white-space:nowrap;padding:7px 11px}
  .side nav button[aria-current="true"]::before{display:none}
  .side-foot{margin:0;margin-inline-start:auto;flex-direction:row;border:0;padding:0}
  .side-btn{width:auto;padding:8px}.side-btn span{display:none}
  .pagebar{position:static}
  .bulk{top:calc(env(safe-area-inset-top,0px) + 112px)!important}
}

h2{font-family:var(--f-display);font-size:22px;margin:0 0 4px;text-wrap:balance}
.sub{color:var(--muted);margin:0 0 18px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.sp{flex:1}

.btn{border:1px solid var(--line);background:var(--surface);padding:7px 14px;border-radius:8px;font-weight:500}
.btn:hover{background:var(--surface2)}
.btn.pri{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.btn.pri:hover{filter:brightness(1.08)}
.btn.sm{padding:3px 10px;font-size:13px}
.btn.danger{color:var(--bad)}
.ghost{border:0;background:transparent;color:var(--muted);padding:4px 8px;border-radius:6px}
.ghost:hover{background:var(--surface2);color:var(--fg)}

.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-bottom:22px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
.stat b{display:block;font-size:28px;line-height:1.2;font-family:var(--f-display);font-weight:700}
.stat span{color:var(--muted);font-size:13px}
.stat.bad b{color:var(--bad)} .stat.good b{color:var(--good)}

.layout{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:20px;align-items:start}
@media (max-width:900px){.layout{grid-template-columns:minmax(0,1fr)}}
.members{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.mcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;text-align:start;display:flex;flex-direction:column;gap:12px;box-shadow:var(--shadow);min-width:0}
.mcard:hover{border-color:var(--accent)}
.mhead{display:flex;align-items:center;gap:10px;min-width:0}
.av{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-weight:700;flex:none;font-family:var(--f-display)}
.mname{font-weight:600;font-size:16px;overflow-wrap:anywhere}
.trio{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;text-align:center}
.trio div{background:var(--surface2);border-radius:8px;padding:6px 2px}
.trio b{display:block;font-size:22px;line-height:1.2}
.trio span{font-size:12px;color:var(--muted)}
.trio .open b{color:var(--warn)} .trio .fin b{color:var(--good)}
.bar{height:6px;background:var(--surface2);border-radius:9px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--good);border-radius:9px}
.mfoot{display:flex;justify-content:space-between;color:var(--muted);font-size:13px}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.panel h3{margin:0 0 10px;font-size:15px}
.up{display:flex;flex-direction:column;gap:2px}
.upi{display:flex;gap:10px;justify-content:space-between;padding:8px 6px;border-radius:8px;align-items:flex-start}
.upi+.upi{border-top:1px solid var(--line)}
.upi div{min-width:0;overflow-wrap:anywhere}
.upi small{color:var(--muted);display:block}
.empty{color:var(--muted);padding:18px;text-align:center;border:1px dashed var(--line);border-radius:var(--r)}

.chip{display:inline-block;padding:0 8px;border-radius:99px;font-size:12px;line-height:20px;background:var(--surface2);color:var(--muted);white-space:nowrap}
.chip.bad{background:var(--bad-soft);color:var(--bad)} .chip.warn{background:var(--warn-soft);color:var(--warn)}
.chip.good{background:var(--good-soft);color:var(--good)} .chip.acc{background:var(--accent-soft);color:var(--accent)}

.tools{display:grid;grid-template-columns:minmax(160px,1fr) repeat(3,minmax(120px,170px)) auto;gap:8px;margin-bottom:12px}
@media (max-width:700px){.tools{grid-template-columns:1fr 1fr}.tools input[type=search]{grid-column:1/-1}}
input,select,textarea{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:7px 10px;width:100%;min-width:0}
textarea{resize:vertical;min-height:110px}
.bulk{position:sticky;top:calc(env(safe-area-inset-top,0px) + 62px);z-index:5;background:var(--accent-soft);border:1px solid var(--accent);border-radius:var(--r);padding:8px 12px;margin-bottom:10px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.bulk select{width:auto;min-width:140px}
.task{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);margin-bottom:10px;overflow:hidden}
.thead{display:flex;gap:12px;align-items:center;padding:12px 14px;cursor:pointer;flex-wrap:wrap}
.thead:hover{background:var(--surface2)}
.ttitle{font-weight:600;flex:1;min-width:140px;overflow-wrap:anywhere}
.tprog{width:110px}
.tbody{border-top:1px solid var(--line);padding:6px 10px 12px}
.sub-row{display:grid;grid-template-columns:24px minmax(0,1fr) 150px 170px 64px;gap:8px;align-items:center;padding:7px 4px;border-bottom:1px solid var(--line)}
.sub-row:last-of-type{border-bottom:0}
@media (max-width:760px){.sub-row{grid-template-columns:24px minmax(0,1fr) 64px}.sub-row .sa,.sub-row .sd{grid-column:2/3}}
.stbtn{width:22px;height:22px;border-radius:50%;border:2px solid var(--muted);background:transparent;padding:0;display:grid;place-items:center;font-size:12px;line-height:1}
.stbtn.doing{border-color:var(--warn);background:linear-gradient(90deg,var(--warn) 50%,transparent 50%)}
.stbtn.done{border-color:var(--good);background:var(--good);color:#fff}
.st-title{overflow-wrap:anywhere;cursor:pointer}
.st-title.done{text-decoration:line-through;color:var(--muted)}
.sa select{padding:4px 8px;font-size:13px}
.sd{font-size:13px;color:var(--muted)} .sd.late{color:var(--bad);font-weight:600}
.tact{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.cb{width:auto}

.alert{display:flex;gap:12px;align-items:flex-start;justify-content:space-between;background:var(--surface);border:1px solid var(--line);border-inline-start:4px solid var(--warn);border-radius:var(--r);padding:10px 14px;margin-bottom:8px;flex-wrap:wrap}
.alert.late{border-inline-start-color:var(--bad)}
.alert .t{min-width:160px;flex:1;overflow-wrap:anywhere}
.alert small{color:var(--muted);display:block}
h3.sec{margin:20px 0 8px;font-size:15px;color:var(--muted)}

.mlist{display:grid;gap:8px}
.mrow{display:flex;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px 14px;flex-wrap:wrap}

#toasts{position:fixed;right:max(18px,env(safe-area-inset-right,0px));left:auto;bottom:calc(18px + env(safe-area-inset-bottom,0px));z-index:60;display:flex;flex-direction:column-reverse;gap:12px;width:min(460px,calc(100vw - 36px))}
.toast{background:var(--fg);color:var(--bg);border-radius:14px;padding:18px 22px;font-size:16px;line-height:1.5;box-shadow:0 12px 36px rgba(0,0,0,.35);cursor:pointer;overflow-wrap:anywhere;animation:toastin .28s ease-out}
.toast b{display:block;font-size:18px;margin-bottom:4px}
@keyframes toastin{from{transform:translateX(40px);opacity:0}to{transform:none;opacity:1}}
.toast.al{border-left:7px solid var(--warn)}

.ov{position:fixed;inset:0;background:rgba(10,16,24,.55);z-index:50;display:grid;place-items:center;padding:16px;overflow:auto}
.ov[hidden]{display:none}
.modal{background:var(--surface);border-radius:14px;padding:20px;width:min(480px,100%);max-height:100%;overflow:auto;box-shadow:var(--shadow)}
.modal h3{margin:0 0 14px;font-family:var(--f-display);font-size:19px}
.fld{display:grid;gap:4px;margin-bottom:12px}
.fld label{font-size:13px;color:var(--muted)}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:420px){.f2{grid-template-columns:1fr}}
.hint{font-size:12px;color:var(--muted)}

.modal.wide{width:min(680px,100%)}
.fl{display:grid;gap:3px;font-size:12px;color:var(--muted)}
.grow{flex:1;min-width:0}
.subrow{border:1px solid var(--line);border-radius:8px;padding:10px;margin-bottom:8px;background:var(--bg)}
.subrow-top{display:flex;gap:6px;align-items:flex-end}
.subrow-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin-top:8px}
.subs-head{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin:14px 0 6px}
.subs-head b{font-size:15px}
.tpl{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;margin-bottom:10px}
.tpl-subs{margin:8px 0 0;padding-inline-start:22px;display:grid;gap:2px}
.tpl-subs li{overflow-wrap:anywhere}
.tpl-subs .hint{margin-inline-start:6px}

.tscroll{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.ptable{border-collapse:collapse;width:100%;min-width:700px}
.ptable th,.ptable td{padding:10px 12px;border-bottom:1px solid var(--line);text-align:center;vertical-align:middle}
.ptable th{font-size:13px;color:var(--muted);font-weight:600;background:var(--surface2)}
.ptable th:first-child,.ptable td:first-child{text-align:start}
.ptable tr:last-child td{border-bottom:0}
.ptable tr.team td{background:var(--surface2);font-weight:600}
.ptable td b{display:block;font-size:17px;line-height:1.3}
.ptable td small{display:block;color:var(--muted);font-size:12px}
.ptable .bar{margin:4px auto 0;width:70px;height:4px}
.pm{display:flex;gap:8px;align-items:center;min-width:120px}
.case-row{display:grid;grid-template-columns:22px minmax(0,1fr) 130px 170px 110px;gap:8px;align-items:center;padding:7px 4px;border-bottom:1px solid var(--line)}
.case-row:last-of-type{border-bottom:0}
@media (max-width:760px){.case-row{grid-template-columns:22px minmax(0,1fr)}.case-row>:nth-child(n+3){grid-column:2/3}}
.thead.static{cursor:default}.thead.static:hover{background:transparent}
.perf-sec{margin-top:26px}

.expopt{display:grid;gap:6px;padding:12px;border:1px solid var(--line);border-radius:10px;margin-bottom:10px;justify-items:start}

.chip.pr5{background:var(--bad-soft);color:var(--bad)}.chip.pr4{background:var(--warn-soft);color:var(--warn)}.chip.pr3{background:var(--accent-soft);color:var(--accent)}
.btn[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent);border-color:var(--accent)}
.combo{position:relative}
.combolist{position:absolute;inset-inline:0;top:100%;z-index:70;background:var(--surface);border:1px solid var(--line);border-radius:8px;box-shadow:var(--shadow);max-height:220px;overflow:auto;margin-top:4px;padding:4px;display:grid}
.copt{border:0;background:transparent;text-align:start;padding:7px 10px;border-radius:6px;display:flex;justify-content:space-between;gap:8px;overflow-wrap:anywhere}
.copt:hover,.copt:focus-visible{background:var(--surface2)}
.copt.new{color:var(--accent);font-weight:600}
.hintrow{color:var(--muted);font-size:13px;padding:7px 10px}
.cal-grid{display:grid;gap:8px;grid-template-columns:repeat(auto-fit,minmax(140px,1fr))}
.cal-grid.day{grid-template-columns:minmax(0,1fr)}
.cday{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:8px;min-width:0;display:flex;flex-direction:column;gap:6px}
.cday.today{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.chead{display:flex;gap:6px;align-items:center;flex-wrap:wrap;padding-bottom:4px;border-bottom:1px solid var(--line)}
.chead .num{color:var(--muted);font-size:13px;flex:1}
.cempty{padding:6px 2px}
.citem{display:flex;gap:8px;align-items:flex-start;background:var(--bg);border:1px solid var(--line);border-inline-start:4px solid var(--line);border-radius:8px;padding:6px 8px;min-width:0}
.citem.pr5{border-inline-start-color:var(--bad)}.citem.pr4{border-inline-start-color:var(--warn)}.citem.pr3{border-inline-start-color:var(--accent)}
.cbody{min-width:0;flex:1}
.ctitle{overflow-wrap:anywhere;font-weight:500}
.cmeta{font-size:12px;color:var(--muted);overflow-wrap:anywhere}
.cmeta .late{color:var(--bad);font-weight:600}

.donecb{width:20px;height:20px;accent-color:var(--good);cursor:pointer;margin:0;flex:none}
.rdone{background:var(--good-soft);border-radius:6px}
.citem.rdone{border-color:var(--good);border-inline-start-color:var(--good)}
.case-row.rdone{border-radius:6px}
.acts{display:flex;gap:4px;align-items:center;justify-content:flex-end}
.alchip{display:block;border:0;background:transparent;color:var(--accent);padding:0;font-size:12px;text-decoration:underline;text-align:start;cursor:pointer}
.task.fin{border-color:var(--good)}
.task.fin .thead{background:var(--good-soft)}
.frow{display:grid;grid-template-columns:minmax(0,1fr) 140px 170px;gap:8px;padding:5px 4px;border-bottom:1px solid var(--line)}
@media (max-width:760px){.frow{grid-template-columns:minmax(0,1fr)}}
.alert.upc{border-inline-start-color:var(--line)}
.alert .donecb{margin-top:3px}

h2{font-size:24px;font-weight:700;letter-spacing:-.01em}
.sub{font-size:14px}
.btn{min-height:34px;display:inline-flex;align-items:center;gap:6px}
.btn.sm{min-height:28px}
.stat{box-shadow:var(--shadow);padding:14px 16px}
.stat b{font-size:30px;letter-spacing:-.02em}
.mcard,.task,.panel,.tpl,.cday,.tscroll,.alert,.mrow{box-shadow:var(--shadow)}
.mcard{transition:border-color .15s,transform .15s}.mcard:hover{transform:translateY(-1px)}
.thead{padding:13px 16px}
.chip{font-weight:500}
input,select,textarea{border-radius:8px}
.modal{border-radius:16px}

/* ---------- daily recurring tasks created automatically at 8:00 ---------- */
const pad2=n=>String(n).padStart(2,'0');
const dayKey=d=>d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate());
const dayLabel=d=>pad2(d.getDate())+'/'+pad2(d.getMonth()+1)+'/'+d.getFullYear();
const HOLDER=uid();let autoBusy=false,autoPause=0;
function buildFromTpl(tp,now,key,id){const who=caseOwner(tp.caseId)||(tp.assignee&&S.members.some(m=>m.id===tp.assignee)?tp.assignee:'');
  return {id,created:Date.now(),title:tp.name+' '+dayLabel(now),notes:tp.notes||'',caseId:S.cases.some(c=>c.id===tp.caseId)?tp.caseId:'',priority:tp.priority||3,
    due:dueFromRule('daily','',tp.time),remind:tp.remind==null?30:tp.remind,assignee:who,status:'todo',tplId:tp.id,tplDate:key,
    subs:(tp.subs||[]).map(x=>({id:uid(),title:x.title,assignee:who,status:'todo',due:dueFromRule('daily','',x.time),remind:x.remind==null?30:x.remind,priority:x.priority||''}))}}
async function autoRun(){
  if(ROLE.readonly||!S.ready||autoBusy||Date.now()<autoPause)return;const now=new Date();if(now.getHours()<8)return;
  const key=dayKey(now);const doneLocal=new Set(lsGet('tm_autodone',[]));
  const todo=S.templates.filter(tp=>tp.kind==='daily'&&tp.auto!==false&&!getAll().some(x=>x.tplId===tp.id&&x.tplDate===key)&&!doneLocal.has('auto-'+tp.id+'-'+key));
  if(!todo.length)return;autoBusy=true;let made=0;
  try{
    for(const tp of todo){const id='auto-'+tp.id+'-'+key;const task=buildFromTpl(tp,now,key,id);
      if(DB){
        try{const mk=DB.collection('autorun').doc(id);const r=await mk.acquire({holder:HOLDER,ttlMs:8000});if(!r.acquired)continue;
          const snap=await mk.get();const d=snap.exists?snap.data():null;if(d&&d.done)continue;
          const{id:_x,...body}=task;await DB.collection('tasks').doc(id).set(body);await mk.set({done:true,at:Date.now()});made++}
        catch(e){autoPause=Date.now()+10*60000;break}
      }else{S.tasks.push(task);persistLocal();made++}
      doneLocal.add(id)}
  }finally{autoBusy=false}
  lsSet('tm_autodone',[...doneLocal].slice(-500));
  if(made){refresh();toast(t('autoToastT'),t('autoToastB',made),{go:'tasks'})}}

function calHTML(U){

  const fWk=new Intl.DateTimeFormat(l,{weekday:CAL.mode==='day'?'long':'short'}),fDt=new Intl.DateTimeFormat(l,{day:'numeric',month:'short'}),fT=new Intl.DateTimeFormat(l,{hour:'numeric',minute:'2-digit'});
  const range=CAL.mode==='day'?new Intl.DateTimeFormat(l,{weekday:'long',day:'numeric',month:'long',year:'numeric'}).format(base):fDt.format(days[0])+' – '+fDt.format(days[6]);
  const us=U.filter(u=>u.due&&(!CAL.m||(CAL.m==='__none'?!u.assignee:u.assignee===CAL.m)));

    const items=us.filter(u=>dueMs(u)>=a&&dueMs(u)<b).sort((x,y)=>y.pr-x.pr||dueMs(x)-dueMs(y));

    ${items.map(u=>citem(u,fT)).join('')||`<div class="hint cempty">${t('calEmptyDay')}</div>`}</div>`}).join('');
  const undated=U.filter(u=>!u.due&&!isDone(u)).length;
  return `<div class="row"><div><h2>${t('calTitle')}</h2><p class="sub">${t('calSub')}</p></div></div>

function mdFmt(md){if(!md)return '';const[m,d]=md.split('-').map(Number);const l=LANG==='ar'?'ar-u-nu-latn':'en-GB';return new Intl.DateTimeFormat(l,{day:'numeric',month:'long'}).format(new Date(2000,m-1,d))}
function ruleText(kind,md,time){return kind==='daily'?(time||''):[mdFmt(md),time].filter(Boolean).join(' · ')}
function dueFromRule(kind,md,time){const now=new Date();
  if(kind==='daily'){if(!time)return '';const[h,m]=time.split(':').map(Number);const d=new Date(now.getFullYear(),now.getMonth(),now.getDate(),h,m);return localISO(d)}
  if(!md)return '';const[mo,da]=md.split('-').map(Number);const[h,m]=(time||'00:00').split(':').map(Number);
  let d=new Date(now.getFullYear(),mo-1,da,h,m);if(d<now)d=new Date(now.getFullYear()+1,mo-1,da,h,m);return localISO(d)}

let actx=null;
function beep(){try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();const o=actx.createOscillator(),g=actx.createGain();o.connect(g);g.connect(actx.destination);
  o.type='sine';o.frequency.value=880;g.gain.setValueAtTime(.0001,actx.currentTime);g.gain.exponentialRampToValueAtTime(.25,actx.currentTime+.02);g.gain.exponentialRampToValueAtTime(.0001,actx.currentTime+.6);o.start();o.stop(actx.currentTime+.65)}catch(e){}}
function toast(title,body,opts={}){const d=document.createElement('div');d.className='toast'+(opts.alert?' al':'');d.innerHTML=`<b>${esc(title)}</b>${esc(body||'')}`;
  d.addEventListener('click',()=>{d.remove();if(opts.go)setView(opts.go)});$('#toasts').appendChild(d);setTimeout(()=>d.remove(),opts.alert?12000:5000)}
function notify(ti,b){try{if('Notification' in window&&Notification.permission==='granted')new Notification(ti,{body:b})}catch(e){}}
function check(){
  if(!S.ready)return;checkProf();const fired=new Set(lsGet('tm_fired',[]));const U=units();const fresh=[];
  for(const u of U){if(!isAlerting(u))continue;const k=u.id+'|'+u.due+'|'+u.remind;if(!fired.has(k)){fired.add(k);fresh.push(u)}}
  if(!fresh.length)return;lsSet('tm_fired',[...fired].slice(-2000));beep();
  if(fresh.length<=3)fresh.forEach(u=>{const body=(u.assignee?mName(u.assignee)+' · ':'')+(isLate(u)?t('pastDue',fmt(u.due)):t('dueAt',fmt(u.due)));toast(u.title,body,{alert:true,go:'alerts'});notify(u.title,body)});
  else{toast(t('newAlerts',fresh.length),t('tapView'),{alert:true,go:'alerts'});notify(t('newAlerts',fresh.length),t('openToView'))}
  refresh()}

function importBackup(text){let d;try{d=JSON.parse(text)}catch(e){d=null}
  if(!d||d.app!=='portfolio-managing-tool'){toast(t('importBadT'),t('importBadB'));return}
  let n=0;const ok=x=>x&&typeof x.id==='string'&&x.id;

/* file readers: zip / docx / xlsx without external libraries */
async function zipRead(buf){const dv=new DataView(buf),u8=new Uint8Array(buf);let e=u8.length-22;while(e>=0&&dv.getUint32(e,true)!==0x06054b50)e--;if(e<0)throw new Error('zip');
  const n=dv.getUint16(e+10,true);let p=dv.getUint32(e+16,true);const files={};
  for(let i=0;i<n;i++){if(dv.getUint32(p,true)!==0x02014b50)break;const meth=dv.getUint16(p+10,true),cs=dv.getUint32(p+20,true),nl=dv.getUint16(p+28,true),xl=dv.getUint16(p+30,true),cl=dv.getUint16(p+32,true),off=dv.getUint32(p+42,true);
    files[new TextDecoder().decode(u8.subarray(p+46,p+46+nl))]={meth,cs,off};p+=46+nl+xl+cl}
  const get=async name=>{const f=files[name];if(!f)return null;const lnl=dv.getUint16(f.off+26,true),lxl=dv.getUint16(f.off+28,true);const st=f.off+30+lnl+lxl;const data=u8.subarray(st,st+f.cs);
    if(f.meth===0)return new TextDecoder().decode(data);if(f.meth!==8)throw new Error('zip method');
    if(typeof DecompressionStream==='undefined')throw new Error('nostream');
    const ds=new Blob([data]).stream().pipeThrough(new DecompressionStream('deflate-raw'));return new TextDecoder().decode(await new Response(ds).arrayBuffer())};
  return{names:Object.keys(files),get}}
function docxToHTML(xml){const doc=new DOMParser().parseFromString(xml,'application/xml');
  const kids=(el,n)=>[...el.children].filter(c=>c.localName===n);const first=(el,n)=>kids(el,n)[0]||null;
  const escH=s=>s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  function runHTML(r){const pr=first(r,'rPr');let txt='';[...r.children].forEach(c=>{if(c.localName==='t')txt+=escH(c.textContent);else if(c.localName==='tab')txt+='&nbsp;&nbsp;&nbsp;&nbsp;';else if(c.localName==='br')txt+='<br>'});if(!txt)return'';
    if(pr){const on=n=>{const e=first(pr,n);if(!e)return false;const v=e.getAttribute('w:val');return v!=='0'&&v!=='false'};if(on('b'))txt=`<b>${txt}</b>`;if(on('i'))txt=`<i>${txt}</i>`;const u=first(pr,'u');if(u&&u.getAttribute('w:val')!=='none')txt=`<u>${txt}</u>`}return txt}
  const paraInner=p=>{let h='';[...p.children].forEach(c=>{if(c.localName==='r')h+=runHTML(c);else if(['hyperlink','smartTag','ins'].includes(c.localName))kids(c,'r').forEach(r=>h+=runHTML(r))});return h};
  function bodyHTML(body){let h='',inList=false;[...body.children].forEach(el=>{
    if(el.localName==='p'){const ppr=first(el,'pPr');const st=ppr&&first(ppr,'pStyle');const sv=st?st.getAttribute('w:val'):'';const isLi=ppr&&first(ppr,'numPr');const inner=paraInner(el);
      if(isLi){if(!inList){h+='<ul>';inList=true}h+=`<li>${inner}</li>`;return}if(inList){h+='</ul>';inList=false}
      let tag='p';const hm=/^Heading(\d)/i.exec(sv);if(hm)tag='h'+Math.min(4,Math.max(2,+hm[1]+1));else if(/^Title$/i.test(sv))tag='h2';
      const jc=ppr&&first(ppr,'jc');const al=jc?({center:'center',right:'right',both:'justify'}[jc.getAttribute('w:val')]||''):'';
      h+=`<${tag}${al?` style="text-align:${al}"`:''}>${inner||'<br>'}</${tag}>`}
    else if(el.localName==='tbl'){if(inList){h+='</ul>';inList=false}h+='<table>'+kids(el,'tr').map(tr=>'<tr>'+kids(tr,'tc').map(tc=>'<td>'+bodyHTML(tc)+'</td>').join('')+'</tr>').join('')+'</table>'}});
    if(inList)h+='</ul>';return h}
  const body=[...doc.getElementsByTagName('*')].find(e=>e.localName==='body');return body?bodyHTML(body):''}
async function xlsxRows(buf){const z=await zipRead(buf);const X=s=>new DOMParser().parseFromString(s,'application/xml');const all=d=>[...d.getElementsByTagName('*')];
  const wb=X(await z.get('xl/workbook.xml'));const sh=all(wb).find(e=>e.localName==='sheet');let target='worksheets/sheet1.xml';
  if(sh){const rid=sh.getAttribute('r:id');const rels=await z.get('xl/_rels/workbook.xml.rels');if(rels&&rid){const rel=all(X(rels)).find(e=>e.localName==='Relationship'&&e.getAttribute('Id')===rid);if(rel)target=rel.getAttribute('Target').replace(/^\//,'').replace(/^xl\//,'')}}
  const ss=[];const sst=await z.get('xl/sharedStrings.xml');if(sst)all(X(sst)).filter(e=>e.localName==='si').forEach(si=>{ss.push(all(si).filter(e=>e.localName==='t').map(e=>e.textContent).join(''))});
  const sx=X(await z.get('xl/'+target));const rows=[];
  all(sx).filter(e=>e.localName==='c').forEach(c=>{const m=/^([A-Z]+)(\d+)$/.exec(c.getAttribute('r')||'');if(!m)return;let col=0;for(const ch of m[1])col=col*26+ch.charCodeAt(0)-64;col--;const row=+m[2]-1;
    const ty=c.getAttribute('t');const v=[...c.children].find(e=>e.localName==='v');const is=[...c.children].find(e=>e.localName==='is');let val='';
    if(ty==='s'&&v)val=ss[+v.textContent]||'';else if(ty==='inlineStr'&&is)val=all(is).filter(e=>e.localName==='t').map(e=>e.textContent).join('');else if(v)val=v.textContent;
    (rows[row]=rows[row]||[])[col]=val});
  const C=Math.max(0,...rows.filter(Boolean).map(r=>r.length));return Array.from({length:rows.length},(_,i)=>Array.from({length:C},(_,j)=>String(((rows[i]||[])[j])??'')))}
function parseDelim(tx){tx=tx.replace(/^﻿/,'');const l1=tx.split('\n')[0];const cnt=ch=>(l1.match(new RegExp(ch==='\t'?'\\t':ch,'g'))||[]).length;const delim=cnt('\t')?'\t':(cnt(';')>cnt(',')?';':',');
  const rows=[];let row=[],cur='',q=false;for(let i=0;i<tx.length;i++){const ch=tx[i];if(q){if(ch==='"'){if(tx[i+1]==='"'){cur+='"';i++}else q=false}else cur+=ch}else if(ch==='"')q=true;else if(ch===delim){row.push(cur);cur=''}else if(ch==='\n'||ch==='\r'){if(ch==='\r'&&tx[i+1]==='\n')i++;row.push(cur);rows.push(row);row=[];cur=''}else cur+=ch}
  if(cur!==''||row.length){row.push(cur);rows.push(row)}return rows}

const CSORT={key:'name',dir:'asc'};
function parseNum(s){s=String(s||'').replace(/,/g,'');const m=s.match(/-?\d+(\.\d+)?/);if(!m)return NaN;let n=parseFloat(m[0]);const rest=s.slice(m.index+m[0].length).trim().toLowerCase();
  if(/^(b|bn|billion)/.test(rest))n*=1e9;else if(/^(m|mn|mm|million)/.test(rest))n*=1e6;else if(/^(k|thousand)/.test(rest))n*=1e3;else if(/^(month|months|شهر|أشهر)/.test(rest))n/=12;else if(/^(day|days|يوم|أيام)/.test(rest))n/=365;return n}
function sortKeys(){const keys={};const add=(sec,lbl,field,ftype)=>{keys[`p|${sec}|${lbl}|${field}`]={sec,lbl,field,ftype}};
  Object.values(PROF).forEach(p=>{(p.limits||[]).forEach(r=>{if(r.type){add('limits',r.type,'amount','num');add('limits',r.type,'tenor','num')}});(p.main||[]).forEach(r=>{if(r.item){add('main',r.item,'date','date');add('main',r.item,'num','num')}});
    (p.dates||[]).forEach(r=>{if(r.item)add('dates',r.item,'date','date')});(p.covs||[]).forEach(r=>{if(r.cov){add('covs',r.cov,'amount','num');add('covs',r.cov,'actual','num')}});
    (p.reports||[]).forEach(r=>{if(r.name)add('reports',r.name,'date','date')});(p.approvals||[]).forEach(r=>{if(r.type){add('approvals',r.type,'date','date');add('approvals',r.type,'expiry','date')}})});
  [['main','date'],['dates','date'],['reports','date'],['approvals','date'],['approvals','expiry']].forEach(([sec,f])=>{if(Object.values(PROF).some(p=>(p[sec]||[]).some(r=>r[f])))keys[`p|${sec}||${f}|any`]={sec,lbl:'',field:f,ftype:'date',any:true}});
  keys['p|limits||total']={sec:'limits',lbl:'',field:'amount',ftype:'num',total:true};return keys}
function caseSortVal(c,def){const es=((PROF[c.id]||{})[def.sec]||[]).filter(e=>def.total||def.any||String(e[NAMEF[def.sec]]||'').trim()===def.lbl);
  const vals=es.map(e=>def.ftype==='date'?Date.parse(e[def.field]):parseNum(e[def.field])).filter(v=>isFinite(v));if(!vals.length)return NaN;
  return def.ftype==='date'?(CSORT.dir==='desc'?Math.max(...vals):Math.min(...vals)):vals.reduce((a,b)=>a+b,0)}
function caseSortShow(c){const k=CSORT.key;if(!k.startsWith('p|'))return'';const def=sortKeys()[k];if(!def)return'';const v=caseSortVal(c,def);if(!isFinite(v))return'';
  return (def.total?g('p_limits')+' Σ':(g(PTITLE[def.sec])+' › '+(def.lbl||g('sort_any'))+' › '+g('sf_'+def.field)+(def.ftype==='date'?' ('+g(CSORT.dir==='desc'?'sort_latest':'sort_earliest')+')':'')))+': '+(def.ftype==='date'?new Date(v).toISOString().slice(0,10):v.toLocaleString('en-US',{maximumFractionDigits:2}))}
function sortedCases(){const cs=S.cases.slice();const k=CSORT.key,dir=CSORT.dir==='desc'?-1:1;const on=c=>{const m=S.members.find(x=>x.id===c.owner);return m?m.name:''};
  if(k==='owner')cs.sort((a,b)=>{const x=on(a),y=on(b);if(!x&&!y)return 0;if(!x)return 1;if(!y)return -1;return x.localeCompare(y)*dir});
  else if(k==='name')cs.sort((a,b)=>(a.name||'').localeCompare(b.name||'')*dir);
  else if(k==='new')cs.sort((a,b)=>((a.created||0)-(b.created||0))*dir);
  else if(k.startsWith('p|')){const def=sortKeys()[k];if(def){const vm={};cs.forEach(c=>{vm[c.id]=caseSortVal(c,def)});cs.sort((a,b)=>{const x=vm[a.id],y=vm[b.id];const nx=!isFinite(x),ny=!isFinite(y);if(nx&&ny)return 0;if(nx)return 1;if(ny)return -1;return (x-y)*dir})}}
  return cs}
function sortBar(){const keys=sortKeys();const groups={};Object.entries(keys).forEach(([k,d])=>{if(d.total)return;(groups[d.sec]=groups[d.sec]||[]).push([k,d])});
  const opts=['limits','main','dates','covs','reports','approvals'].filter(s=>groups[s]).map(s=>`<optgroup label="${esc(g(PTITLE[s]))}">${groups[s].sort((a,b)=>(a[1].lbl+a[1].field).localeCompare(b[1].lbl+b[1].field)).map(([k,d])=>`<option value="${esc(k)}" ${CSORT.key===k?'selected':''}>${esc((d.lbl||g('sort_any'))+' › '+g('sf_'+d.field))}</option>`).join('')}</optgroup>`).join('');

/* ---------- v3: alerts for dates inside company profiles ---------- */
function profAlerts(){const out=[];
  Object.entries(PROF).forEach(([cid,p])=>{const c=S.cases.find(x=>x.id===cid);if(!c)return;if(!ROLE.admin&&c.owner!==ROLE.me)return;
    const add=(r,k,label)=>{const rm=r[k+'_r'];if(!r[k]||rm==null||+rm<0)return;const due=new Date(r[k]+'T09:00:00').getTime();if(!isFinite(due))return;out.push({key:`${cid}|${r.id}|${k}|${r[k]}|${rm}`,cid,title:`${c.name} · ${label}`,due,at:due-rm*60000,pr:+(r[k+'_p']||3),dateStr:r[k]})};
    (p.main||[]).forEach(r=>add(r,'date',r.item||''));(p.dates||[]).forEach(r=>add(r,'date',r.item||''));(p.reports||[]).forEach(r=>add(r,'date',r.name||''));
    (p.approvals||[]).forEach(r=>{add(r,'date',(r.type||'')+' · '+g('pc_date'));add(r,'expiry',(r.type||'')+' · '+g('pc_expiry'))})});
  return out.sort((a,b)=>a.at-b.at)}
let profActive=()=>{const n=Date.now();return profAlerts().filter(a=>a.at<=n&&a.due+86400000>n)};
function checkProf(){const fired=new Set(lsGet('tm_firedp',[]));const fresh=profActive().filter(a=>!fired.has(a.key));if(!fresh.length)return;
  fresh.forEach(a=>fired.add(a.key));lsSet('tm_firedp',[...fired].slice(-1000));beep();fresh.slice(0,3).forEach(a=>{const body=g('pa_due',a.dateStr);toast(a.title,body,{alert:true,go:'alerts'});notify(a.title,body)});refresh()}
function profAlertsHTML(){const n=Date.now();const list=profAlerts().filter(a=>a.due+86400000>n).slice(0,200);
  return `<h3 class="sec">${g('pa_title')}</h3>`+(list.map(a=>{const act=a.at<=n;return `<div class="alert ${act?'':'upc'}"><div class="t"><b>${esc(a.title)}</b> ${prChip(a.pr)}<small>${g('pa_due',esc(a.dateStr))}</small><small class="num">${t('alertWhen',fmt(localISO(new Date(a.at))))}</small></div><span class="chip ${act?'warn':''} num">${act?rel(a.due-n):t('alertsIn',rel(a.at-n))}</span></div>`}).join('')||`<div class="empty">${g('pa_none')}</div>`)}
function subscribeExtras(){const u=[];
  u.push(DB.collection('profiles').onSnapshot(sn=>{PROF={};sn.docs.forEach(d=>{if(d.id==='__fx'){FX=d.data()||{};lsSet('tm_fx',FX)}else if(d.id==='__opts'){const o=d.data().opts;if(o&&typeof o==='object'){POPTS=o;lsSet('tm_popts',POPTS)}}else PROF[d.id]=d.data()});refresh();check()},()=>{}));
  u.push(DB.collection('files').orderBy('at').onSnapshot(sn=>{FILES=sn.docs.map(d=>({id:d.id,...d.data()}));refresh()},()=>{}));return u}

  sheets.forEach(s=>{s.rows=s.rows||[];s.fmt=s.fmt||{};s.cw=s.cw||{};s.R=s.R||30;s.C=s.C||12});
  const keep=same?SH.act:(f&&f.act)||0;SH={cid,sheets,act:Math.min(keep,sheets.length-1)};

const raw=(s,r,c)=>{const v=(s.rows[r]||[])[c];return v==null?'':String(v)};
function setRaw(s,r,c,v){if(r>=SH_MAXR||c>=SH_MAXC)return;while(s.rows.length<=r)s.rows.push([]);const row=s.rows[r];while(row.length<=c)row.push('');row[c]=v}

const FN={

function displayOf(si,r,c){const s=SH.sheets[si];const rw=raw(s,r,c);if(rw==='')return{t:'',type:'blank'};

function sugg(sec,k){const key=sec+'.'+k;const out=[];const seen=new Set();const add=v=>{v=String(v||'').trim();if(v&&!seen.has(v.toLowerCase())){seen.add(v.toLowerCase());out.push(v)}};
  (POPTS[key]||[]).forEach(add);const cnt={};Object.values(PROF).forEach(p=>(p[sec]||[]).forEach(r=>{const v=String(r[k]||'').trim();if(v)cnt[v]=(cnt[v]||0)+1}));

const dateCell=(r,k)=>{const d=r[k];if(!d)return'';const rm=r[k+'_r'];return `<span class="num">${esc(d)}</span>${rm!=null&&+rm>=0?` <span class="chip warn" title="${esc(g('pc_alert'))}">🔔 ${esc(g('rm_'+rm))}</span> ${prChip(r[k+'_p']||3)}`:''}`};
function sortRows(sec,rows){const st=PSORT[sec];if(!st||!st.k)return rows;const col=PCOLS[sec].find(c=>c.k===st.k);if(!col)return rows;const dir=st.dir===-1?-1:1;
  const key=r=>{const v=String(r[col.k]||'').trim();if(!v)return null;if(col.date||col.dt){const d=Date.parse(v);return isFinite(d)?d:null}const n=parseNum(v);return isFinite(n)&&/\d/.test(v)?n:v.toLowerCase()};
  return rows.slice().sort((a,b)=>{const x=key(a),y=key(b);if(x===null&&y===null)return 0;if(x===null)return 1;if(y===null)return -1;if(typeof x==='number'&&typeof y==='number')return (x-y)*dir;return String(x).localeCompare(String(y),undefined,{numeric:true})*dir})}
function secBar(sec,n){const st=PSORT[sec]||{};return `<div class="psortbar"><label class="hint" for="ps-${sec}">${g('srt')}</label><select class="psort-k" id="ps-${sec}" data-sec="${sec}"><option value="">${g('p_nosort')}</option>${PCOLS[sec].map(c=>`<option value="${c.k}" ${st.k===c.k?'selected':''}>${g(c.l)}</option>`).join('')}</select><button type="button" class="btn sm" data-a="psort-dir" data-sec="${sec}" title="${esc(g('csort_dir'))}">${st.dir===-1?'↓':'↑'}</button><button type="button" class="btn sm" data-a="psec-csv" data-sec="${sec}">⬇ CSV</button></div>`}

function secCSV(sec){const cols=PCOLS[sec];const rows=sortRows(sec,getProf(CASE)[sec]||[]);const hd=cols.map(c=>csvEsc(g(c.l)));cols.forEach(c=>{if(c.date)hd.push(csvEsc(g(c.l)+' · '+g('pc_alert')))});
  const lines=[hd.join(',')].concat(rows.map(r=>{const o=cols.map(c=>csvEsc(String(r[c.k]||'')));cols.forEach(c=>{if(c.date){const rm=r[c.k+'_r'];o.push(csvEsc(rm!=null&&+rm>=0?g('rm_'+rm):''))}});return o.join(',')}));

let FILES=[];const FILEDATA={};const FILE_MAX=700*1024;
const fsz=n=>n<1024?n+' B':n<1048576?(n/1024).toFixed(0)+' KB':(n/1048576).toFixed(1)+' MB';
const canDelFile=f=>ROLE.admin||(!!f.uid&&f.uid===ROLE.uid);
function fileChips(cid,sec,rid){const fs=FILES.filter(f=>f.cid===cid&&f.sec===sec&&f.rid===rid).sort((a,b)=>a.at-b.at);
  return fs.map(f=>`<span class="fchip"><button type="button" class="lnk" data-a="f-dl" data-id="${esc(f.id)}" title="${esc(f.name+' · '+fsz(f.size))}">📎 ${esc(f.name.length>22?f.name.slice(0,20)+'…':f.name)}</button>${canDelFile(f)?`<button type="button" class="x" data-a="f-del" data-id="${esc(f.id)}" aria-label="${esc(t('del'))}">✕</button>`:''}</span>`).join('')+(ROLE.admin?`<button type="button" class="btn sm" data-a="f-up" data-cid="${esc(cid)}" data-sec="${sec}" data-rid="${esc(rid)}">⬆ ${g('f_upload')}</button>`:'')}
function pickFiles(cid,sec,rid){const inp=document.createElement('input');inp.type='file';inp.multiple=true;inp.hidden=true;document.body.appendChild(inp);
  inp.addEventListener('change',async()=>{const fl=[...inp.files];inp.remove();await uploadFiles(fl,cid,sec,rid)});inp.click()}
function readB64(f){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(String(r.result).split(',')[1]||'');r.onerror=()=>rej(r.error);r.readAsDataURL(f)})}
async function uploadFiles(list,cid,sec,rid){let n=0;const od=sec==='daily'?(DY.od||todayStr()):todayStr();
  for(const f of list){if(f.size>FILE_MAX){toast(g('f_toobig',f.name),g('f_toobigb',fsz(FILE_MAX)),{alert:true});continue}
    try{const b64=await readB64(f);const id=uid();const meta={cid,sec,rid:rid||'',name:f.name,size:f.size,type:f.type||'application/octet-stream',od,at:Date.now(),by:curName(),uid:ROLE.uid||''};
      FILES.push({id,...meta});n++;
      if(DB)queue(async()=>{await DB.collection('fdata').doc(id).set({d:b64,cid,sec,uid:meta.uid});await DB.collection('files').doc(id).set(meta)});else FILEDATA[id]=b64}catch(x){toast(g('f_fail'),String(x&&x.message||x))}}
  if(n){toast(g('f_done',n));refresh()}}
async function downloadFile(id){const f=FILES.find(x=>x.id===id);if(!f)return;let b64=null;
  try{if(DB){const sn=await DB.collection('fdata').doc(id).get();b64=sn&&sn.exists?sn.data().d:null}else b64=FILEDATA[id]||null}catch(x){}
  if(!b64){toast(g('f_missing'));return}const bin=atob(b64),u8=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u8[i]=bin.charCodeAt(i);saveBlob(f.name,new Blob([u8],{type:f.type||'application/octet-stream'}))}
function dropFile(id){FILES=FILES.filter(f=>f.id!==id);delete FILEDATA[id];if(DB){queue(()=>DB.collection('files').doc(id).delete());queue(()=>DB.collection('fdata').doc(id).delete())}}

  CM.push({id,...c});if(DB)queue(()=>DB.collection('comments').doc(id).set(c));else persistLocal()}
function delComment(id){CM=CM.filter(c=>c.id!==id&&c.parent!==id);if(DB){queue(()=>DB.collection('comments').doc(id).delete());CM.filter(c=>c.parent===id).forEach(c=>queue(()=>DB.collection('comments').doc(c.id).delete()))}else persistLocal();refreshThread()}
function markSeen(cs){const key=myKey(),now=Date.now(),nm=curName();let any=false;
  cs.forEach(c=>{if(isMine(c)||(c.seen&&c.seen[key]))return;any=true;c.seen=c.seen||{};c.seen[key]={n:nm,at:now};
    if(DB){const id=c.id;queue(()=>{const d=DB.collection('comments').doc(id);if(d.update)return d.update({['seen.'+key]:{n:nm,at:now}});const{id:_i,...rest}=c;return d.set(rest)})}});
  if(any){if(!DB)persistLocal();updCBell()}return any}
let THR=null,REPLY=null;
function seenHTML(c){const sb=seenList(c);if(sb.length)return '👁 '+g('cm_seenby')+': '+sb.map(x=>esc(x.n)+' <span class="num">'+cmFmt(x.at)+'</span>').join(' · ');return isMine(c)?'<span class="hint">'+g('cm_notseen')+'</span>':''}
function cmFlat(list){const byId={};list.forEach(c=>byId[c.id]=c);const kids={};const roots=[];list.forEach(c=>{if(c.parent&&byId[c.parent])(kids[c.parent]=kids[c.parent]||[]).push(c);else roots.push(c)});
  const out=[];const walk=(c,d)=>{out.push({c,d});(kids[c.id]||[]).sort((a,b)=>a.at-b.at).forEach(k=>walk(k,d+1))};roots.sort((a,b)=>a.at-b.at).forEach(r=>walk(r,0));return out}
function threadHTML(){if(!THR)return'';const list=CM.filter(c=>c.tid===THR.tid&&(c.sid||'')===THR.sid);const byId={};list.forEach(c=>byId[c.id]=c);
  return cmFlat(list).map(({c,d})=>`<div class="cm ${THR.unread&&THR.unread.has(c.id)?'unread':''}" style="margin-inline-start:${Math.min(d,3)*18}px"><div class="cmh">${prChip(c.pr||3)}<b>${esc(c.by)}</b><span class="hint">${cmFmt(c.at)}</span>${c.parent&&byId[c.parent]?`<span class="hint">↩ ${esc(byId[c.parent].by)}</span>`:''}${ROLE.admin?`<button type="button" class="ghost" data-a="del-cmt" data-id="${esc(c.id)}" aria-label="${t('delTip')}">✕</button>`:''}</div><div class="cmb">${esc(c.text)}</div><div class="cmf"><button type="button" class="btn sm" data-a="cm-reply" data-id="${esc(c.id)}">↩ ${g('cm_reply')}</button><button type="button" class="btn sm" data-a="cm-dup" data-id="${esc(c.id)}" title="${esc(g('cd_btn'))}">⧉ ${g('cd_btn')}</button><span class="seen">${seenHTML(c)}</span></div></div>`).join('')||`<div class="hint">${g('cmtNone')}</div>`}
function refreshThread(){const th=$('#thread');if(th&&THR&&!$('#ov').hidden){th.innerHTML=threadHTML();th.scrollTop=th.scrollHeight}}
function setReply(c){REPLY=c||null;const r=$('#replyto');if(r){r.hidden=!c;if(c)r.querySelector('span').textContent=c.by+': '+(c.text.length>50?c.text.slice(0,48)+'…':c.text);const sel=$('#f-cpr');if(c&&sel)sel.value=String(c.pr||3)}const ta=$('#f-cm');if(c&&ta)ta.focus()}
function openThread(tid,sid){const tg=cmTarget(tid);if(!tg)return;THR={tid,sid:sid||''};REPLY=null;
  const sb=sid&&tg.kind==='task'?(tg.obj.subs||[]).find(x=>x.id===sid):null;const ttl=(tg.kind==='case'?g('cm_case')+': ':'')+(sb?tg.title+' › '+sb.title:tg.title);
  const mine=CM.filter(c=>c.tid===tid&&(c.sid||'')===(sid||''));THR.unread=new Set(mine.filter(isUnread).map(c=>c.id));
  modal(`<h3>${g('cmtT')}</h3><p class="hint" style="margin:-8px 0 10px">${esc(ttl)}</p><div class="thread" id="thread">${threadHTML()}</div><div class="replyto" id="replyto" hidden>↩ <span></span> <button type="button" class="ghost" data-a="cm-noreply" aria-label="${esc(t('cancel'))}">✕</button></div><div class="fld"><label for="f-cm">${g('cmtAdd')}</label><textarea id="f-cm" name="text" required style="min-height:70px"></textarea></div><div class="fld"><label for="f-cpr">${g('cmtPr')}</label><select id="f-cpr" name="pr">${prOpts(3)}</select></div><div class="row"><button class="btn pri" type="submit">${g('cmtSend')}</button><button class="btn" type="button" data-close>${t('cancel')}</button></div>`,fd=>{
    const tx=(fd.get('text')||'').trim();if(!tx)return false;addComment(tid,sid,tx,fd.get('pr'),REPLY?REPLY.id:'');REPLY=null;const ta=$('#f-cm');if(ta){ta.value='';ta.focus()}setReply(null);refreshThread();refresh();return false});
  const th=$('#thread');if(th)th.scrollTop=th.scrollHeight;markSeen(mine)}
const CV={q:'',s:'new',f:'all'};
function buildCommentsShell(){$('#view').innerHTML=`<div class="row"><div><h2>${NL('comments')}</h2><p class="sub">${g('cvSub')}</p></div></div>
  <div class="tools" style="grid-template-columns:minmax(160px,1fr) minmax(150px,200px) minmax(150px,220px)"><input type="search" id="cvq" placeholder="${esc(t('search'))}" aria-label="${esc(t('search'))}" value="${esc(CV.q)}"><select id="cvf" aria-label="${esc(g('cvFilter'))}">${['all','unread','mine'].map(k=>`<option value="${k}">${g('cvf_'+k)}</option>`).join('')}</select><select id="cvs" aria-label="${esc(g('cvSort'))}">${['new','old','pr','task'].map(k=>`<option value="${k}">${g('cvs_'+k)}</option>`).join('')}</select></div><div id="cvlist"></div>`;
  $('#cvs').value=CV.s;$('#cvf').value=CV.f;$('#cvq').addEventListener('input',e=>{CV.q=e.target.value;fillComments()});$('#cvs').addEventListener('change',e=>{CV.s=e.target.value;fillComments()});$('#cvf').addEventListener('change',e=>{CV.f=e.target.value;fillComments()})}
function fillComments(){const lst=$('#cvlist');if(!lst)return;const q=CV.q.toLowerCase();const byId={};CM.forEach(c=>byId[c.id]=c);
  let list=CM.filter(cmVisible).map(c=>{const tg=cmTarget(c.tid);const tk=tg.obj;const sb=c.sid&&tg.kind==='task'?(tk.subs||[]).find(x=>x.id===c.sid):null;return{...c,title:tg.title,kind:tg.kind,sub:sb?sb.title:'',pr:+(c.pr||3),del:!!tk.deleted,unread:isUnread(c)}})
    .filter(c=>(CV.f==='all'||(CV.f==='unread'&&c.unread)||(CV.f==='mine'&&isMine(c)))&&(!q||(c.text+' '+c.by+' '+c.title+' '+c.sub).toLowerCase().includes(q)));
  const s=CV.s;list.sort((a,b)=>s==='old'?a.at-b.at:s==='pr'?(b.pr-a.pr||b.at-a.at):s==='task'?((a.title||'').localeCompare(b.title||'')||a.at-b.at):b.at-a.at);
  lst.innerHTML=`<p class="hint num">${g('cvCount',list.length)}${list.some(c=>c.unread)?` · <button type="button" class="btn sm" data-a="cm-readall">✓ ${g('cm_readall')}</button>`:''}</p>`+(list.map(c=>`<div class="cmrow ${c.unread?'unread':''}" data-a="cmt" data-t="${esc(c.tid)}" data-s="${esc(c.sid||'')}" role="button" tabindex="0"><div class="cmh">${c.unread?'<span class="udot" aria-label="unread">●</span>':''}${prChip(c.pr)}<b>${c.kind==='case'?esc(g('cm_case'))+': ':''}${esc(c.title)}${c.sub?' › '+esc(c.sub):''}</b>${c.del?`<span class="chip bad">${g('cvDeleted')}</span>`:''}${c.parent&&byId[c.parent]?`<span class="hint">↩ ${esc(byId[c.parent].by)}</span>`:''}<span class="hint" style="margin-inline-start:auto">${esc(c.by)} · ${cmFmt(c.at)}</span></div><div class="cmb">${esc(c.text)}</div><div class="cmf"><button type="button" class="btn sm" data-a="cm-reply" data-id="${esc(c.id)}">↩ ${g('cm_reply')}</button><button type="button" class="btn sm" data-a="cm-dup" data-id="${esc(c.id)}" title="${esc(g('cd_btn'))}">⧉ ${g('cd_btn')}</button>${c.unread?`<button type="button" class="btn sm" data-a="cm-read" data-id="${esc(c.id)}">✓ ${g('cm_read')}</button>`:''}<span class="seen">${seenHTML(c)}</span></div></div>`).join('')||`<div class="empty">${g('cvNone')}</div>`)}
let CMINIT=false,CMKNOWN=new Set();
function cmNotify(){const ids=new Set(CM.map(c=>c.id));if(!CMINIT){CMINIT=true;CMKNOWN=ids;return}
  const fresh=CM.filter(c=>!CMKNOWN.has(c.id)&&!isMine(c)&&cmVisible(c));CMKNOWN=ids;
  if(fresh.length){beep();const c=fresh[fresh.length-1];const tg=cmTarget(c.tid);toast(g('cm_new',fresh.length),(c.by||'')+': '+String(c.text).slice(0,80)+(tg?' — '+tg.title:''),{alert:true,go:'comments'})}}

const DY={s:'name',dir:1,od:'',open:{}};
function dailyHTML(){const od=DY.od||todayStr();const own=c=>{const m=S.members.find(x=>x.id===c.owner);return m?m.name:''};
  const rows=S.cases.map(c=>{const fs=FILES.filter(f=>f.sec==='daily'&&f.cid===c.id).sort((a,b)=>(b.od||'').localeCompare(a.od||'')||b.at-a.at);return{c,fs,last:fs[0]?fs[0].od:'',n:fs.length}});
  const dir=DY.dir;rows.sort((a,b)=>{let r;if(DY.s==='last'){if(!a.last&&!b.last)r=0;else if(!a.last)return 1;else if(!b.last)return -1;else r=a.last.localeCompare(b.last)}else if(DY.s==='count')r=a.n-b.n;else if(DY.s==='owner'){const x=own(a.c),y=own(b.c);if(!x&&!y)r=0;else if(!x)return 1;else if(!y)return -1;else r=x.localeCompare(y)}else r=(a.c.name||'').localeCompare(b.c.name||'');return r*dir});

  const el=e.target.closest&&e.target.closest('[data-a]');if(!el)return;const a=el.dataset.a,id=el.dataset.id;
  if(a==='f-up'){if(!(ROLE.admin||el.dataset.sec==='daily'))return;pickFiles(el.dataset.cid,el.dataset.sec,el.dataset.rid||'')}
  else if(a==='f-dl'){if(id)downloadFile(id)}
  else if(a==='f-del'){const f=FILES.find(x=>x.id===id);if(f&&canDelFile(f))confirmModal(g('f_delconf',f.name),()=>dropFile(id)||refresh())}
  else if(a==='psort-dir'){const st=PSORT[el.dataset.sec]=PSORT[el.dataset.sec]||{};st.dir=st.dir===-1?1:-1;refresh()}
  else if(a==='psec-csv')secCSV(el.dataset.sec)

  else if(a==='dy-toggle'){DY.open[id]=!DY.open[id];refresh()}
  else if(a==='cm-reply'){const c=CM.find(x=>x.id===id);if(!c)return;if(THR&&THR.tid===c.tid&&THR.sid===(c.sid||'')&&!$('#ov').hidden)setReply(c);else{openThread(c.tid,c.sid||'');setReply(c)}}
  else if(a==='cm-noreply')setReply(null)
  else if(a==='cm-read'){const c=CM.find(x=>x.id===id);if(c){markSeen([c]);refresh()}}
  else if(a==='cm-readall'){markSeen(CM.filter(c=>cmVisible(c)&&isUnread(c)));refresh()}});

function sndPlay(id,vol){try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();if(actx.state==='suspended')actx.resume();
  const t0=actx.currentTime+.02,out=actx.createGain();out.gain.value=Math.max(0,Math.min(1,vol==null?SND.vol:vol));out.connect(actx.destination);
  const T=(f,s,d,ty,v,f2)=>{const o=actx.createOscillator(),gn=actx.createGain();o.type=ty||'sine';o.frequency.setValueAtTime(f,t0+s);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t0+s+d);

  (SNDDEF[id]||SNDDEF.chime)(T)}catch(e){}}

/* ---- duplicate a task to another case (immediately on click) ---- */
function dupTaskTo(tk,target,keep){const src=caseName(tk.caseId)||'',tn=caseName(target)||'';const same=target===tk.caseId;const n=JSON.parse(JSON.stringify(tk));
  ['deleted','deletedBy','deletedAt','doneAt','rv','reviewed','reviewedAt','revAt','tplId','tplDate'].forEach(k=>delete n[k]);
  n.id=uid();n.created=Date.now();n.caseId=target;
  let title=renameCo(tk.title,src,tn);if(same||title===tk.title)title=same?tk.title+' ('+g('dupCopy')+')':tk.title+' – '+tn;n.title=title;
  n.notes=renameCo(tk.notes||'',src,tn);n.status='todo';if(!keep)n.due='';
  n.subs=(tk.subs||[]).map(sb=>{const o=JSON.parse(JSON.stringify(sb));['doneAt','rv','reviewed','reviewedAt','revAt'].forEach(k=>delete o[k]);o.id=uid();o.title=renameCo(sb.title,src,tn);if(sb.notes)o.notes=renameCo(sb.notes,src,tn);o.status='todo';if(!keep)o.due='';return o});
  const ow=caseOwner(target);if(ow)n.assignee=ow;saveTask(n);return n}
function dupForm(tid){const tk=S.tasks.find(x=>x.id===tid);if(!tk)return;
  pickCaseModal({title:'⧉ '+g('dp_title'),sub:tk.title+((tk.subs||[]).length?' · '+tk.subs.length+' '+g('delSubs'):''),hint:g('dp_hint'),newOk:true,

function calStep(dir){const d=CAL.d,y=d.getFullYear(),m=d.getMonth(),dd=d.getDate();
  CAL.d=CAL.mode==='day'?new Date(y,m,dd+dir):CAL.mode==='week'?new Date(y,m,dd+7*dir):CAL.mode==='month'?new Date(y,m+dir,1):new Date(y,Math.floor(m/3)*3+3*dir,1)}
function calMonthHTML(y,m,byDay,compact,l){const first=new Date(y,m,1),off=(first.getDay()+1)%7,dim=new Date(y,m+1,0).getDate(),weeks=Math.ceil((off+dim)/7),start=new Date(y,m,1-off);
  const fW=new Intl.DateTimeFormat(l,{weekday:'short'});const todayK=dayKey(new Date());
  let h=`<div class="cal-month ${compact?'mini':''}">`+Array.from({length:7},(_,i)=>`<div class="cal-wd">${esc(fW.format(new Date(start.getFullYear(),start.getMonth(),start.getDate()+i)))}</div>`).join('');
  for(let i=0;i<weeks*7;i++){const d=new Date(start.getFullYear(),start.getMonth(),start.getDate()+i),k=dayKey(d),out=d.getMonth()!==m,items=byDay[k]||[];

/* ---- FX rates (stored in profiles/__fx, readable by everyone, writable by the admin) ---- */
let FX=lsGet('tm_fx',{})||{};
const FXC=['USD','EUR','GBP'];
function fxRate(c){c=String(c||'EGP').toUpperCase();if(c==='EGP')return 1;const o=FX[c];const r=o&&+o.r;return r>0?r:null}
function toEGP(v,c){const n=typeof v==='number'?v:R2num(v);if(n==null)return null;const r=fxRate(c);return r==null?null:n*r}
function fxPersist(){lsSet('tm_fx',FX);if(DB&&ROLE.admin)queue(()=>DB.collection('profiles').doc('__fx').set(JSON.parse(JSON.stringify(FX))))}
function fxSave(){if(!ROLE.admin)return;let bad=false,any=false;
  FXC.forEach(c=>{const ri=document.querySelector('.fxin[data-c="'+c+'"]'),di=document.querySelector('.fxdt[data-c="'+c+'"]');if(!ri)return;
    const raw=String(ri.value||'').replace(/,/g,'').trim();if(!raw){return}const r=parseFloat(raw);if(!(r>0)){bad=true;return}
    const d=(di&&di.value)||todayStr();const o=FX[c]||{};const h=(o.h||[]).filter(x=>x.d!==d);h.push({d,r});h.sort((a,b)=>a.d<b.d?-1:1);
    if(+o.r!==r||o.d!==d){FX[c]={r,d,h:h.slice(-400)};any=true}});
  if(bad){toast(g('fx_title'),g('fx_bad'));return}
  if(any){fxPersist();toast(g('fx_title'),g('fx_saved'));setTimeout(()=>{if(view==='dashboard')dashView()},350)}}

/* ---- Dashboard ---- */
const fxN=n=>Math.round(n).toLocaleString('en-US');
function dashData(){const ts=todayStr();const byCcy={},byType={},byCase=[];let A=0,Us=0,nl=0;const miss=new Set();
  S.cases.forEach(c=>{let a=0,u=0;(getProf(c.id).limits||[]).forEach(l=>{if(l.parent)return;const raw=R2num(l.amount);if(raw==null)return;const ccy=(l.ccy||'EGP').toUpperCase();nl++;
    const o=byCcy[ccy]=byCcy[ccy]||{n:0,raw:0,egp:0};o.n++;o.raw+=raw;const e=toEGP(raw,ccy);if(e==null){miss.add(ccy);return}
    o.egp+=e;a+=e;const k=l.type||'—';const ty=byType[k]=byType[k]||{a:0,u:0,n:0};ty.a+=e;ty.n++;const us=utilAt(l,ts);if(us){u+=us.a;Us+=us.a;ty.u+=us.a}});
    a=facA(c,a);A+=a;if(a||u)byCase.push({c,a,u})});
  return{A,Us,nl,byCcy,byType,byCase,miss:[...miss]}}
function dashBar(p,cls){const w=Math.max(0,Math.min(100,p||0));return `<span class="dbar"><i class="${cls||''}" style="width:${w}%"></i></span>`}
function dashHTML(){const D=dashData(),U=units(),ed=ROLE.admin,ts=todayStr();
  const fxRows=FXC.map(c=>{const o=FX[c]||{};const st=!(+o.r>0)?`<span class="chip warn">${esc(g('fx_none'))}</span>`:o.d===ts?`<span class="chip good">✓ ${esc(g('fx_today'))}</span>`:`<span class="chip warn">${esc(g('fx_stale',o.d||'—'))}</span>`;
    return `<div class="fxrow"><span class="fxpair"><b>${c}</b> / EGP</span><div class="fxf"><label>${g('fx_rate')}</label><input class="fxin num" data-c="${c}" inputmode="decimal" autocomplete="off" value="${+o.r>0?esc(String(o.r)):''}" ${ed?'':'disabled'} placeholder="0.00"></div>
     <div class="fxf"><label>${g('fx_date')}</label><input class="fxdt" type="date" data-c="${c}" value="${esc(ts)}" ${ed?'':'disabled'}></div>${st}</div>`}).join('');
  const kp=(l,v,s,cls)=>`<div class="kpi ${cls||''}"><span class="kl">${l}</span><b class="kv num">${v}</b>${s?`<span class="ks">${s}</span>`:''}</div>`;
  const pct=D.A>0?D.Us/D.A*100:0;const openU=U.filter(u=>!isDone(u)).length,lateU=U.filter(isLate).length;
  const ccyRows=Object.entries(D.byCcy).map(([c,o])=>`<tr><td><b>${c}</b></td><td class="n">${o.n}</td><td class="n">${fxN(o.raw)}</td><td class="n">${c==='EGP'?'1':fxRate(c)==null?'—':fxRate(c)}</td><td class="n"><b>${fxRate(c)==null?'—':fxN(o.egp)}</b></td></tr>`).join('');
  const types=Object.entries(D.byType).sort((a,b)=>b[1].a-a[1].a),mx=Math.max(1,...types.map(x=>x[1].a));
  const cs=D.byCase.sort((a,b)=>b.a-a.a);
  return `<div class="row"><div><h2>${g('dash_title')}</h2><p class="sub">${g('dash_sub')} · ${g('dash_asof')} ${esc(ts)}</p></div></div>
  <section class="dcard fxcard" id="fxbox"><div class="dhead"><div><h3>💱 ${g('fx_title')}</h3><p class="hint">${g('fx_hint')}</p></div>${ed?`<button type="button" class="btn pri" data-a="fx-save">${g('fx_save')}</button>`:`<span class="hint">${g('fx_admin')}</span>`}</div><div class="fxrows">${fxRows}</div></section>
  ${D.miss.length?`<div class="dwarn">⚠ ${esc(g('dash_missing',D.miss.join(', ')))}</div>`:''}
  <div class="kpis">${kp(g('dash_lim'),fxN(D.A),g('dash_egp'),'k1')}${kp(g('dash_used'),fxN(D.Us),g('dash_egp'),'k2')}${kp(g('dash_avail'),fxN(Math.max(0,D.A-D.Us)),g('dash_egp'),'k3')}${kp(g('dash_pct'),(Math.round(pct*10)/10)+'%',dashBar(pct,pct>90?'bad':pct>70?'warn':''),'k4')}
   ${kp(g('dash_cases'),S.cases.length,'', '')}${kp(g('dash_nlim'),D.nl,'','')}${kp(g('dash_open'),openU,'','')}${kp(g('dash_late'),lateU,'',lateU?'kbad':'')}</div>
  ${D.nl?`<div class="dgrid"><section class="dcard"><h3>${g('dash_bycc')}</h3><div class="tblwrap"><table class="dtbl"><thead><tr><th>${g('dash_c_ccy')}</th><th class="n">${g('dash_c_n')}</th><th class="n">${g('dash_c_orig')}</th><th class="n">${g('dash_c_rate')}</th><th class="n">${g('dash_c_egp')}</th></tr></thead><tbody>${ccyRows}</tbody></table></div></section>
   <section class="dcard"><h3>${g('dash_bytype')}</h3>${types.map(([k,o])=>`<div class="hbar"><div class="hl"><span>${esc(k)}</span><b class="num">${fxN(o.a)}</b></div>${dashBar(o.a/mx*100)}<div class="hs">${g('dash_c_pct')}: ${o.a>0?Math.round(o.u/o.a*1000)/10:0}%</div></div>`).join('')}</section></div>
   <section class="dcard"><h3>${g('dash_bycase')}</h3><div class="tblwrap"><table class="dtbl"><thead><tr><th>${g('dash_c_case')}</th><th class="n">${g('dash_c_lim')}</th><th class="n">${g('dash_c_used')}</th><th>${g('dash_c_pct')}</th></tr></thead><tbody>${cs.map(x=>{const p=x.a>0?x.u/x.a*100:0;return `<tr><td><b>${esc(x.c.name)}</b></td><td class="n">${fxN(x.a)}</td><td class="n">${fxN(x.u)}</td><td class="pc">${dashBar(p,p>90?'bad':p>70?'warn':'')}<b>${Math.round(p*10)/10}%</b></td></tr>`}).join('')}</tbody></table></div></section>`:`<div class="empty">${g('dash_nodata')}</div>`}`}
function dashView(){const v=$('#view');const ae=document.activeElement;if(ae&&ae.closest&&ae.closest('#fxbox')&&v.contains(ae))return;v.innerHTML=dashHTML()}
document.addEventListener('click',e=>{const el=e.target.closest&&e.target.closest('[data-a="fx-save"]');if(el){e.preventDefault();fxSave()}});

/* ---- professional reports ---- */
function r2cols(s){return s.cols.map((_,i)=>{const vs=s.rows.map(r=>r[i]).filter(v=>v!==''&&v!=null&&v!=='—');return vs.length>0&&vs.every(v=>typeof v==='number')})}
function r2cell(v,isNum){if(typeof v==='number')return `<td class="n">${r2fmt(v)}</td>`;const s=String(v==null?'':v);
  if(/^-?\d+(\.\d+)?%$/.test(s)){const p=Math.max(0,Math.min(100,parseFloat(s)));return `<td class="pc"><span class="dbar"><i style="width:${p}%"></i></span><b>${esc(s)}</b></td>`}
  return `<td class="${isNum?'n':''}">${esc(s)}</td>`}
function r2tableHTML(s){const rows=s.rows;if(!rows.length)return `<section class="rcard"><h3>${esc(s.h)}</h3><div class="empty">${g('r2_empty')}</div></section>`;const nm=r2cols(s);
  return `<section class="rcard"><h3>${esc(s.h)} <span class="chip num">${rows.length}</span></h3><div class="rtbl"><table><thead><tr>${s.cols.map((c,i)=>`<th class="${nm[i]?'n':''}">${esc(c)}</th>`).join('')}</tr></thead><tbody>${rows.slice(0,1500).map(r=>`<tr class="${String(r[0])===g('r2_total')?'tot':''}">${s.cols.map((_,i)=>r2cell(r[i],nm[i])).join('')}</tr>`).join('')}</tbody></table></div>${rows.length>1500?`<p class="hint">${g('r2_trunc',1500)}</p>`:''}</section>`}
function r2kpis(rep){const s=rep.sections[0];if(!s||!s.rows.length)return[];
  if(s.cols.length===3&&s.cols[2]==='%')return s.rows.slice(0,6).map(r=>({l:r[0],v:r[1],s:r[2]}));
  const L=rep.sections[rep.sections.length-1],tr=L&&L.rows.length?L.rows[L.rows.length-1]:null;
  if(tr&&String(tr[0])===g('r2_total'))return L.cols.map((c,i)=>({l:c,v:tr[i]})).slice(1).filter(k=>k.v!==''&&k.v!=null&&k.v!=='—').slice(0,6).map(k=>({l:k.l,v:typeof k.v==='number'?k.v:k.v}));
  return[]}
const r2kpiHTML=rep=>{const k=r2kpis(rep);return k.length?`<div class="kpis rk">${k.map(x=>`<div class="kpi"><span class="kl">${esc(x.l)}</span><b class="kv num">${typeof x.v==='number'?r2fmt(x.v):esc(x.v)}</b>${x.s?`<span class="ks">${esc(x.s)}</span>`:''}</div>`).join('')}</div>`:''};
async function r2run(){const def=REPORTS2.find(r=>r.id===RPT.id);const my=++RPT.seq;const out=$('#rpout');if(!out)return;out.innerHTML=`<p class="hint">${g('r2_loading')}</p>`;
  let rep;try{rep=await def.run({...RPT.p})}catch(e){console.warn(e);rep={title:g('r2_rp_'+def.id),sub:String(e&&e.message||e),sections:[]}}
  if(my!==RPT.seq||!$('#rpout'))return;RPT.res=rep;const xl=!!(DL&&window.XLSX);
  $('#rpout').innerHTML=`<div class="rphd"><div class="rphd-t"><span class="rporg">Portfolio Management System</span><h2>${esc(rep.title)}</h2>${rep.sub?`<p>${esc(rep.sub)}</p>`:''}</div><div class="rphd-a"><button type="button" class="btn sm" data-a="r2-run">↻ ${g('r2_gen')}</button><button type="button" class="btn sm" data-a="r2-present">▶ ${g('r2_present')}</button>${xl?`<button type="button" class="btn sm" data-a="r2-xlsx">${g('r2_xlsx')}</button>`:''}<button type="button" class="btn sm pri" data-a="r2-print">${g('r2_print')}</button></div></div>`+r2kpiHTML(rep)+(rep.sections.map(r2tableHTML).join('')||`<div class="empty">${g('r2_empty')}</div>`)}

/* presentation mode: one slide per page of a table */
let PRES=null;
function presSlides(rep){const sl=[{k:'title'}];const kp=r2kpis(rep);if(kp.length)sl.push({k:'kpi',kp});
  rep.sections.forEach(s=>{if(!s.rows.length)return;const per=s.cols.length>8?8:10;const nm=r2cols(s);for(let i=0;i<s.rows.length;i+=per)sl.push({k:'tbl',s,nm,rows:s.rows.slice(i,i+per),pg:Math.floor(i/per)+1,pgs:Math.ceil(s.rows.length/per)})});return sl}
function presRender(){if(!PRES)return;const rep=PRES.rep,sl=PRES.sl[PRES.i];let h='';
  if(sl.k==='title')h=`<div class="ps-title"><span>Portfolio Management System</span><h1>${esc(rep.title)}</h1>${rep.sub?`<p>${esc(rep.sub)}</p>`:''}<small>${g('pres_gen')}: ${esc(todayStr())}</small></div>`;
  else if(sl.k==='kpi')h=`<h2>${g('kpi_sum')}</h2><div class="kpis pk">${sl.kp.map(x=>`<div class="kpi"><span class="kl">${esc(x.l)}</span><b class="kv num">${typeof x.v==='number'?r2fmt(x.v):esc(x.v)}</b>${x.s?`<span class="ks">${esc(x.s)}</span>`:''}</div>`).join('')}</div>`;
  else h=`<h2>${esc(sl.s.h)}${sl.pgs>1?` <small>(${sl.pg}/${sl.pgs})</small>`:''}</h2><div class="rtbl pt" style="font-size:${sl.s.cols.length>9?'.78rem':sl.s.cols.length>6?'.92rem':'1.05rem'}"><table><thead><tr>${sl.s.cols.map((c,i)=>`<th class="${sl.nm[i]?'n':''}">${esc(c)}</th>`).join('')}</tr></thead><tbody>${sl.rows.map(r=>`<tr class="${String(r[0])===g('r2_total')?'tot':''}">${sl.s.cols.map((_,i)=>r2cell(r[i],sl.nm[i])).join('')}</tr>`).join('')}</tbody></table></div>`;
  PRES.el.innerHTML=`<div class="ps-bar"><span>Portfolio Management System · ${esc(rep.title)}</span><span class="num">${g('pres_of',PRES.i+1,PRES.sl.length)}</span><button type="button" data-a="pres-close">✕ ${g('pres_close')}</button></div><div class="ps-body">${h}</div><button type="button" class="ps-nav prev" data-a="pres-prev" aria-label="prev">‹</button><button type="button" class="ps-nav next" data-a="pres-next" aria-label="next">›</button><div class="ps-foot">Designed by Dr. Hamza Abdelfattah</div>`}
function presOpen(){if(!RPT.res)return;const el=document.createElement('div');el.id='pres';el.setAttribute('role','dialog');document.body.appendChild(el);PRES={rep:RPT.res,sl:presSlides(RPT.res),i:0,el};presRender();try{el.requestFullscreen&&el.requestFullscreen()}catch(e){}}
function presClose(){if(!PRES)return;try{if(document.fullscreenElement)document.exitFullscreen()}catch(e){}PRES.el.remove();PRES=null}
function presGo(d){if(!PRES)return;PRES.i=Math.max(0,Math.min(PRES.sl.length-1,PRES.i+d));presRender()}
document.addEventListener('click',e=>{const el=e.target.closest&&e.target.closest('[data-a]');if(!el)return;const a=el.dataset.a;if(a==='r2-present')presOpen();else if(a==='pres-close')presClose();else if(a==='pres-next')presGo(1);else if(a==='pres-prev')presGo(-1)});

/* ---------- facility helpers (sub-limits are never added; an overall cap replaces the sum) ---------- */
let PF_PARENT='';
const facA=(c,sum)=>{const cp=getProf(c.id).limcap;const e=cp&&toEGP(cp.amount,cp.ccy);return e>0?e:sum};
function caseFac(c,date){const pr=getProf(c.id);let sum=0,used=0,n=0,miss=false;(pr.limits||[]).forEach(l=>{if(l.parent)return;n++;const a=toEGP(l.amount,l.ccy);if(a==null){if(R2num(l.amount)!=null)miss=true;return}sum+=a;const u=utilAt(l,date||todayStr());if(u)used+=u.a});
  const cp=pr.limcap,cap=cp?toEGP(cp.amount,cp.ccy):null;return{sum,used,n,miss,cap:cap>0?cap:0,total:cap>0?cap:sum}}
function limOrder(pr){const L=pr.limits||[];const ids=new Set(L.map(l=>l.id));const mains=L.filter(l=>!l.parent||!ids.has(l.parent));const out=[];
  mains.forEach((m,i)=>{out.push({l:m,no:String(i+1),sub:false});L.filter(s=>s.parent===m.id).forEach((s,j)=>out.push({l:s,no:(i+1)+'.'+(j+1),sub:true}))});return out}

function limitsTable(cid){const pr=getProf(cid),ed=ROLE.admin,cols=PCOLS.limits;const rows0=pr.limits||[];
  if(!rows0.length)return `<div class="hint">${g('p_none')}</div>`;
  const ids=new Set(rows0.map(l=>l.id));const mains=sortRows('limits',rows0.filter(l=>!l.parent||!ids.has(l.parent)));const rows=[];
  mains.forEach(m=>{rows.push(m);sortRows('limits',rows0.filter(s=>s.parent===m.id)).forEach(s=>rows.push(s))});
  const c=S.cases.find(x=>x.id===cid)||{id:cid};const F=caseFac(c);const cp=pr.limcap||{};
  const tr=r=>{const sub=!!(r.parent&&ids.has(r.parent));return `<tr class="${sub?'subrow':''}">${cols.map((cl,i)=>`<td>${i===0&&sub?'<span class="subarrow">↳</span> ':''}${pcell('limits',cl,r)}${i===0&&sub?` <span class="chip">${g('tc_sub')}</span>`:''}</td>`).join('')}${ed?`<td class="pact">${sub?'':`<button class="btn sm" data-a="p-sub" data-id="${esc(r.id)}">＋ ${g('lm_addsub')}</button> <button class="btn sm" data-a="p-dup" data-id="${esc(r.id)}">⧉ ${g('dl_btn')}</button> `}<button class="btn sm" data-a="p-edit" data-sec="limits" data-id="${esc(r.id)}">${g('p_edit')}</button> <button class="btn sm danger" data-a="p-del" data-sec="limits" data-id="${esc(r.id)}">${t('del')}</button></td>`:''}</tr>`};
  const capRow=ed?`<div class="lcap"><label for="lc-amt"><b>${g('lm_cap')}</b></label><input id="lc-amt" class="num" inputmode="decimal" placeholder="${esc(g('lm_capph'))}" value="${esc(cp.amount||'')}"><select id="lc-ccy">${['','USD','EUR','GBP'].map(x=>`<option value="${x}" ${(cp.ccy||'')===x?'selected':''}>${x||'EGP'}</option>`).join('')}</select><button type="button" class="btn sm pri" data-a="lc-save">${g('lm_save')}</button>${cp.amount?`<button type="button" class="btn sm" data-a="lc-clear">${g('lm_clear')}</button>`:''}</div>`:(cp.amount?`<div class="lcap"><b>${g('lm_cap')}:</b> <span class="num">${esc(cp.ccy||'EGP')} ${esc(fmtAmt(cp.amount))}</span></div>`:'');
  return secBar('limits')+`<div class="ptbl"><table><thead><tr>${cols.map(cl=>`<th>${g(cl.l)}</th>`).join('')}${ed?'<th></th>':''}</tr></thead><tbody>${rows.map(tr).join('')}</tbody></table></div>
  <div class="ltot"><div><span>${g('lm_sum')}</span><b class="num">${fxN(F.sum)} EGP</b><small>${g('lm_sumnote')}</small></div>${capRow?`<div class="lcapbox">${capRow}</div>`:''}<div class="lbig"><span>${g('lm_total')}</span><b class="num">${fxN(F.total)} EGP</b><small>${F.cap?g('lm_capnote'):g('lm_sumnote')}</small></div></div>${F.miss?`<div class="dwarn">⚠ ${g('lm_missing')}</div>`:''}<p class="hint">${g('lm_subhint')}</p>`}
const _ptable=ptable;ptable=function(cid,sec){return sec==='limits'?limitsTable(cid):_ptable(cid,sec)};
const _delProfRow=delProfRow;delProfRow=function(cid,sec,rid){if(sec==='limits'){const np=JSON.parse(JSON.stringify(getProf(cid)));const gone=new Set([rid].concat((np.limits||[]).filter(l=>l.parent===rid).map(l=>l.id)));
    np.limits=(np.limits||[]).filter(l=>!gone.has(l.id));np.tc=(np.tc||[]).filter(r=>!(r.g&&r.g.startsWith('L:')&&gone.has(r.g.slice(2))));saveProf(cid,np);return}_delProfRow(cid,sec,rid)};

/* ---------- Terms & Conditions ---------- */
const TCG=[['gen','tc_gen'],['com','tc_com'],['ext','tc_ext'],['inv','tc_inv'],['cla','tc_cla']];
function tcGroups(pr){return limOrder(pr).map(x=>({id:'L:'+x.l.id,sub:x.sub,short:g('tc_limit')+' '+x.no,title:g('tc_limit')+' '+x.no+' — '+(x.l.type||'—')+(x.l.amount?' · '+(x.l.ccy||'EGP')+' '+fmtAmt(x.l.amount):'')+(x.l.tenor?' · '+x.l.tenor:'')})).concat(TCG.map(([id,k])=>({id,title:g(k),short:g(k)})))}
const tcRows=(pr,gid)=>(pr.tc||[]).filter(r=>r.g===gid);
const tcDays=d=>Math.round((new Date(d+'T00:00:00')-new Date(todayStr()+'T00:00:00'))/864e5);
function tcStatus(r){if(r.done)return{k:'done',h:`<span class="chip good">${g('tc_st_done')}</span>`};if(!r.d)return{k:'open',h:''};const n=tcDays(r.d);return n<0?{k:'over',n,h:`<span class="chip bad">${g('tc_st_over',-n)}</span>`}:n===0?{k:'soon',n,h:`<span class="chip warn">${g('tc_st_today')}</span>`}:{k:n<=14?'soon':'open',n,h:`<span class="chip ${n<=14?'warn':''}">${g('tc_st_left',n)}</span>`}}
function tcDate(r){if(!r.d)return '<span class="hint">—</span>';const rm=r.d_r;return `<span class="num">${esc(r.d)}</span> ${rm!=null&&+rm>=0&&!r.done?`<span class="chip warn" title="${esc(g('tc_hint15'))}">🔔 ${esc(g('rm_'+rm))}</span> ${prChip(r.d_p||3)}`:''} ${tcStatus(r).h}`}
function tcHTML(cid){const pr=getProf(cid),ed=ROLE.admin;
  return tcGroups(pr).map(G=>{const rows=tcRows(pr,G.id);
    const hasI=rows.some(r=>r.item),hasP=rows.some(r=>r.prop);
    return `<div class="tcg ${G.sub?'sub':''}"><div class="tcg-h"><b>${esc(G.title)}</b><span class="chip num">${rows.length}</span><span class="sp"></span>${ed?`<button class="btn sm" data-a="tci-open" data-g="${esc(G.id)}">⬆ ${g('tci_btn')}</button><button class="btn sm pri" data-a="tc-add" data-g="${esc(G.id)}">+ ${g('tc_add')}</button>`:''}</div>`+
    (rows.length?`<div class="ptbl"><table class="tctbl"><thead><tr><th class="tcn">#</th>${hasI?`<th>${g('tc_item')}</th>`:''}<th>${g(hasI||hasP?'tc_cur':'tc_text')}</th>${hasP?`<th>${g('tc_prop')}</th>`:''}<th>${g('tc_maxdate')}</th>${ed?'<th></th>':''}</tr></thead><tbody>${rows.map((r,i)=>`<tr class="${r.done?'tcdone':''}"><td class="tcn num">${i+1}</td>${hasI?`<td class="tcitem">${esc(r.item||'')}</td>`:''}<td class="tctext">${esc(r.text||'')}</td>${hasP?`<td class="tctext">${esc(r.prop||'')}</td>`:''}<td class="tcd">${tcDate(r)}</td>${ed?`<td class="pact"><button class="btn sm" data-a="tc-done" data-id="${esc(r.id)}">${r.done?'↺ '+g('tc_reopen'):'✓ '+g('tc_done')}</button> <button class="btn sm" data-a="tc-edit" data-id="${esc(r.id)}">${g('p_edit')}</button> <button class="btn sm danger" data-a="tc-del" data-id="${esc(r.id)}">${t('del')}</button></td>`:''}</tr>`).join('')}</tbody></table></div>`:`<div class="hint" style="padding:10px 14px">${g('tc_none')}</div>`)+`</div>`}).join('')}
function tcForm(cid,rid,gid){const pr=getProf(cid);const row=rid?(pr.tc||[]).find(x=>x.id===rid):null;const Gp=tcGroups(pr).find(x=>x.id===(row?row.g:gid));if(!Gp)return;
  modal(`<h3>${rid?g('p_edit'):g('p_add')} · ${esc(Gp.title)}</h3><div class="fld"><label for="tcf-item">${g('tc_item')}</label><input id="tcf-item" name="item" value="${esc(row&&row.item||'')}" autocomplete="off"></div><div class="fld"><label for="tcf-text">${g('tc_cur')}</label><textarea id="tcf-text" name="text" rows="4">${esc(row?row.text||'':'')}</textarea></div><div class="fld"><label for="tcf-prop">${g('tc_prop')}</label><textarea id="tcf-prop" name="prop" rows="3">${esc(row&&row.prop||'')}</textarea></div>
   <div class="f2"><div class="fld"><label for="tcf-d">${g('tc_maxdate')}</label><input id="tcf-d" type="date" name="d" value="${esc(row&&row.d||'')}"></div><div class="fld"><label for="tcf-r">${g('pc_alert')}</label><select id="tcf-r" name="d_r">${PREM.map(n=>`<option value="${n}" ${(row&&row.d_r!=null?+row.d_r:1440)===n?'selected':''}>${g('rm_'+n)}</option>`).join('')}</select></div></div>
   <div class="fld"><label>${t('fPriority')}</label><select name="d_p">${prOpts(row&&row.d_p||3)}</select></div><p class="hint">${g('tc_hint15')}</p>${foot()}`,fd=>{
    const text=(fd.get('text')||'').trim(),prop=(fd.get('prop')||'').trim(),item=(fd.get('item')||'').trim();if(!text&&!prop&&!item)return false;const np=JSON.parse(JSON.stringify(getProf(cid)));np.tc=np.tc||[];
    const o={id:rid||uid(),g:Gp.id,item,text,prop,d:(fd.get('d')||'').trim(),d_r:+fd.get('d_r'),d_p:+fd.get('d_p')||3,done:row?!!row.done:false};if(row&&row.doneAt)o.doneAt=row.doneAt;
    const i=np.tc.findIndex(x=>x.id===o.id);if(i<0)np.tc.push(o);else np.tc[i]=o;saveProf(cid,np)})}
document.addEventListener('click',e=>{const el=e.target.closest&&e.target.closest('[data-a]');if(!el||!ROLE.admin)return;const a=el.dataset.a;

  const add=sec=>`<button class="btn sm pri" data-a="p-add" data-sec="${sec}">+ ${g('p_add')}</button>`;const gen=getProf(cid).gen||'';
  return `<div class="profile">
  <section class="psec">${hd('p_limits',add('limits'))}${ptable(cid,'limits')}</section>
  <section class="psec">${hd('tc_title','')}${tcHTML(cid)}</section>
